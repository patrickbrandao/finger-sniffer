openapi: 3.1.0
info:
  title: finger-sniffer bot API
  version: 0.7.1
  summary: Vereditos de bot do espelho de análise de conexões.
  description: |
    API do serviço bot (specs 018 e 020, ADRs 0047–0053). Servida em 9002 (HTTPS, pública, com chave) e 9003
    (HTTP, só loopback e a rede do traefik do finger-01, chave opcional; `Authorization` que não seja
    `Bearer fsk_...` é ignorado ali, porque o forwardAuth repassa os cabeçalhos do visitante), portas fora da captura.
    O traefik modificado é o traefix, projeto externo consumido como está (spec 019, ADRs 0054 e 0062).

    Chave: `Authorization: Bearer fsk_<52 caracteres base32>`, emitida pelo operador com a CLI
    `finger-sniffer-bot key create` (sem cadastro). Cada chave tem domínios autorizados: recurso de um site fora
    deles responde 404, igual a recurso inexistente. Limites por chave (balde e cota diária) respondem 429 com
    `Retry-After`.

    Limites de entrada (spec 020 RF-04, ADR 0073): na 9002, por chave, balde e cota por requisição, balde de
    registros no ingest (padrão 500/s, rajada 2 048), até 2 lotes do ingest e 4 clientes do feed ao mesmo tempo
    (429 com `Retry-After`); 200 conexões, até 16 por origem (IPv4 ou /64), ociosas fechadas em 30 s. Na 9003 a chave
    só escolhe domínios e modo: nenhum limite de chave vale ali, só os globais. Globais: lote de 4 MiB (413), até 8
    lotes simultâneos e prazo de 10 s para o corpo (503 `busy`, 400), 64 clientes do feed (503).

    0.6.0 (ADR 0073, aditiva): código `busy`; 429 e 503 novos no ingest e 429 por chave no feed; tetos dos textos do
    ingest (cortados, não recusados); limites da 9003.

    0.7.0 (ADR 0074, **não aditiva** no 403 do `/bot/v1/auth`, exceção aceita pelo humano): o 403 do modo `block`
    passa a ter corpo `Error` `{"error":"forbidden"}`, sem os cabeçalhos de veredito, só com `X-Traefix-Deny: 1`;
    código `forbidden`.

    0.7.1 (task 409, documental): o 403 `forbidden_origin` da 9003 declarado em todas as rotas (resposta
    `ForbiddenOrigin`; no `/bot/v1/auth`, junto do 403 do modo `block`), o 500 `internal` de `/bot/v1/ip/{ip}` e
    `/bot/v1/fingerprints/{kind}/{value}` (falha do banco) e o 404 do feed com `site` fora dos domínios da chave
    (spec 020 RF-03).

    Uso não comercial (ADR 0053): JA4 é BSD-3-Clause; JA4H e JA4T seguem a FoxIO License 1.1; uso comercial exige
    licença da FoxIO.

    Tempos em RFC 3339 UTC com nanossegundos. Compatibilidade (ADR 0001): `/bot/v1` só recebe mudanças aditivas.
    Erros (corpo `Error`): `invalid_key`, `rate_limited`, `not_found`, `bad_request`, `missing_fork_headers`,
    `payload_too_large`, `forbidden_origin`, `internal`, `busy`, `forbidden`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  x-terms: Serviço não comercial; chaves emitidas só para uso não comercial (ADR 0053).
security:
  - apiKey: []
servers:
  - url: https://finger-01.badblock.net.br:9002
    description: HTTPS pública (chave obrigatória)
  - url: http://10.249.255.254:9003
    description: Interna, só para o traefik do finger-01 e loopback (chave opcional)
tags:
  - name: health
    description: Saúde e contrato.
  - name: verdicts
    description: Vereditos por requisição, conexão e probe.
  - name: reputation
    description: Agregados de 7 dias por IP e fingerprint.
  - name: realtime
    description: Feed de vereditos.
  - name: ingest
    description: Envio do traefix (traefik modificado, spec 019).
paths:
  /bot/v1/health:
    get:
      tags: [health]
      operationId: getBotHealth
      summary: Saúde do bot
      security: []
      responses:
        "200":
          description: Estado do serviço.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BotHealth" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
  /bot/v1/openapi.yaml:
    get:
      tags: [health]
      operationId: getBotOpenAPI
      summary: Este contrato
      security: []
      responses:
        "200":
          description: OpenAPI em YAML.
          content:
            application/yaml:
              schema: { type: string }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
  /bot/v1/auth:
    get:
      tags: [verdicts]
      operationId: forwardAuth
      summary: forwardAuth do traefik
      description: |
        Avalia a requisição descrita por `X-Forwarded-Method`, `X-Forwarded-Host`, `X-Forwarded-Uri` e pelos
        `X-Traefix-*` que o traefix acrescenta (spec 019 RF-05 e RF-08). Os `X-Fs-*` antigos (obsoletos) só valem
        quando `X-Traefix-Conn-Id` não veio, e nunca se misturam com os `X-Traefix-*` (ADR 0063 item 1). Origem
        obrigatória: `Src-Ip`, `Src-Port`, `Dst-Port`, `Conn-Id` e `Proto` de um dos dois conjuntos; sem eles, 400
        `missing_fork_headers`. Na 9003 espera a visão até `FS_BOT_VIEW_WAIT` (100 ms; com `X-Traefix-Ja4`, só a do
        store); na 9002 não espera o store (ADR 0063 item 7). No modo `observe` responde sempre 200; no modo
        `block`, 403 para `class=bot`. 400 `bad_request` com chave cujos domínios não casam com `X-Forwarded-Host`
        (erro de configuração do operador, ADR 0055). O JA4H vem de `X-Traefix-Ja4h` quando bem formado e, sem ele,
        da última requisição da conexão no ingest (ADR 0058). A visão TLS e h2 vem do registro de conexão do ingest
        e, antes dele, de `X-Traefix-Ja4`, `-Ja3`, `-H2` e `-Alpn`; a TCP, do store, senão do registro do traefix,
        senão de `X-Traefix-Ja4t` (ADRs 0062 e 0063). Cabeçalho malformado ou repetido é ignorado. O 200 traz
        `X-Traefix-Verdict`, `-Score`, `-Signals` e os `X-Fs-*` equivalentes (obsoletos); o 403 do modo `block` tem
        corpo mínimo e só `X-Traefix-Deny` (ADR 0074); nenhuma resposta de erro traz `X-Traefix-Verdict` nem
        `X-Fs-Verdict` (o traefix usa isso no fail-open de 4xx, spec 019 RF-04).
      parameters:
        - { name: X-Traefix-Src-Ip, in: header, required: false, schema: { type: string } }
        - { name: X-Traefix-Src-Port, in: header, required: false, schema: { type: integer, minimum: 0, maximum: 65535 } }
        - { name: X-Traefix-Dst-Port, in: header, required: false, schema: { type: integer, minimum: 0, maximum: 65535 } }
        - { name: X-Traefix-Conn-Id, in: header, required: false, schema: { $ref: "#/components/schemas/ULID" } }
        - { name: X-Traefix-Proto, in: header, required: false, schema: { type: string, enum: [h1, h2, h3] } }
        - name: X-Traefix-Ja4h
          in: header
          required: false
          description: JA4H completo da requisição calculado pelo traefix (spec 019 RF-05).
          schema: { type: string, pattern: "^[a-z0-9]{12}_[0-9a-f]{12}_[0-9a-f]{12}_[0-9a-f]{12}$" }
        - name: X-Traefix-Ja4
          in: header
          required: false
          description: JA4 (FoxIO) do ClientHello calculado pelo traefix, `t` em TCP e `q` em QUIC (ADR 0062).
          schema: { type: string, pattern: "^[tq][0-9a-z]{2}[di][0-9]{4}[0-9a-z]{2}_[0-9a-f]{12}_[0-9a-f]{12}$" }
        - name: X-Traefix-Ja3
          in: header
          required: false
          description: MD5 do JA3 calculado pelo traefix (ADR 0062).
          schema: { type: string, pattern: "^[0-9a-f]{32}$" }
        - name: X-Traefix-H2
          in: header
          required: false
          description: Akamai h2 calculado pelo traefix, só em h2, no formato do web do espelho (ADR 0062).
          schema: { type: string, maxLength: 512 }
        - name: X-Traefix-Alpn
          in: header
          required: false
          description: ALPN oferecido no ClientHello, na ordem do cliente, separado por vírgula, com `%XX` fora do ASCII visível e para `,` e `%`; até 16 valores (ADR 0063 item 6).
          schema: { type: string, maxLength: 1024 }
        - name: X-Traefix-Ja4t
          in: header
          required: false
          description: JA4T do SYN do cliente, com `fingerprint.tcp` no traefix (ADR 0063 item 5).
          schema: { type: string, pattern: "^[0-9]+_[0-9-]+_[0-9]{2,}_[0-9]+$" }
        - name: X-Traefix-Ttl
          in: header
          required: false
          description: TTL (ou hop limit) como recebido, do SYN em TCP (com `tcp`) ou do primeiro Initial em h3 (ADR 0065 item 4).
          schema: { type: integer, minimum: 0, maximum: 255 }
        - name: X-Traefix-Timing
          in: header
          required: false
          description: |
            Tempos do início da conexão, `chave=valor` por vírgula (`src`, `proto`, `tcp_rtt_us`, `est_to_first_us`,
            `ch_us`, `srv_us`, `tls_rtt_us`, `tls_us`, `rtt_gap_us`, `req_us`; em h3 `initial_to_hs_us`, `quic_rtt_us`,
            `quic_min_rtt_us`); chaves desconhecidas ignoradas; com `headerDetail: full` (ADR 0065 item 2).
          schema: { type: string, maxLength: 2048 }
        - name: X-Traefix-Ja3n
          in: header
          required: false
          description: "MD5 do JA3N (extensões ordenadas), com `headerDetail: full` (ADR 0065 item 6)."
          schema: { type: string, pattern: "^[0-9a-f]{32}$" }
        - name: X-Traefix-Ja4r
          in: header
          required: false
          description: "JA4_r (FoxIO), com `headerDetail: full` (ADR 0065 item 6)."
          schema: { type: string, maxLength: 2048 }
        - name: X-Traefix-Ja4o
          in: header
          required: false
          description: "JA4_o (FoxIO), com `headerDetail: full` (ADR 0065 item 6)."
          schema: { type: string, pattern: "^[tq][0-9a-z]{2}[di][0-9]{4}[0-9a-z]{2}_[0-9a-f]{12}_[0-9a-f]{12}$" }
        - { name: X-Fs-Src-Ip, in: header, required: false, deprecated: true, schema: { type: string } }
        - { name: X-Fs-Src-Port, in: header, required: false, deprecated: true, schema: { type: integer, minimum: 0, maximum: 65535 } }
        - { name: X-Fs-Dst-Port, in: header, required: false, deprecated: true, schema: { type: integer, minimum: 0, maximum: 65535 } }
        - { name: X-Fs-Conn-Id, in: header, required: false, deprecated: true, schema: { $ref: "#/components/schemas/ULID" } }
        - { name: X-Fs-Proto, in: header, required: false, deprecated: true, schema: { type: string, enum: [h1, h2, h3] } }
        - { name: X-Fs-Ja4h, in: header, required: false, deprecated: true, schema: { type: string, pattern: "^[a-z0-9]{12}_[0-9a-f]{12}_[0-9a-f]{12}_[0-9a-f]{12}$" } }
        - { name: X-Fs-Ja4, in: header, required: false, deprecated: true, schema: { type: string, pattern: "^[tq][0-9a-z]{2}[di][0-9]{4}[0-9a-z]{2}_[0-9a-f]{12}_[0-9a-f]{12}$" } }
        - { name: X-Fs-Ja3, in: header, required: false, deprecated: true, schema: { type: string, pattern: "^[0-9a-f]{32}$" } }
        - { name: X-Fs-H2, in: header, required: false, deprecated: true, schema: { type: string, maxLength: 512 } }
        - { name: X-Forwarded-Host, in: header, schema: { type: string } }
        - { name: X-Forwarded-Uri, in: header, schema: { type: string } }
        - { name: X-Forwarded-Method, in: header, schema: { type: string } }
      responses:
        "200":
          description: Requisição liberada (com o veredito nos cabeçalhos para `authResponseHeaders`).
          headers:
            X-Traefix-Verdict: { $ref: "#/components/headers/XFsVerdict" }
            X-Traefix-Score: { $ref: "#/components/headers/XFsScore" }
            X-Traefix-Signals: { $ref: "#/components/headers/XFsSignals" }
            X-Fs-Verdict: { $ref: "#/components/headers/XFsVerdictDeprecated" }
            X-Fs-Score: { $ref: "#/components/headers/XFsScoreDeprecated" }
            X-Fs-Signals: { $ref: "#/components/headers/XFsSignalsDeprecated" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Verdict" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403":
          description: |
            Dois casos, ambos com corpo `Error` e sem os cabeçalhos do veredito. (1) Origem fora das redes
            permitidas, só na 9003 (`forbidden_origin`, sem `X-Traefix-Deny`: o traefix trata como fail-open).
            (2) Modo `block` e `class=bot` (ADR 0074): corpo mínimo `{"error":"forbidden"}`, sem `X-Traefix-Verdict`,
            `X-Traefix-Score`, `X-Traefix-Signals` nem os `X-Fs-*`; só o marcador `X-Traefix-Deny`, que o traefix usa
            (`failOpen.denyRequiresResponseHeader: X-Traefix-Deny`, spec 019 RF-04) para devolver o 403 ao visitante.
          headers:
            X-Traefix-Deny:
              description: Marcador do bloqueio; só no caso (2).
              schema: { type: string, const: "1" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /bot/v1/verdict:
    get:
      tags: [verdicts]
      operationId: getVerdictBySource
      summary: Consulta pelo site (origem da conexão)
      parameters:
        - { name: src_ip, in: query, required: true, schema: { type: string } }
        - { name: src_port, in: query, required: true, schema: { type: integer, minimum: 0, maximum: 65535 } }
        - { name: site, in: query, required: true, schema: { type: string }, description: "Host/SNI da requisição." }
        - $ref: "#/components/parameters/Wait"
      responses:
        "200":
          description: Último veredito da conexão.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Verdict" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /bot/v1/verdict/conn/{fs_conn_id}:
    get:
      tags: [verdicts]
      operationId: getVerdictByForkConn
      summary: Consulta pelo id de conexão do traefix
      parameters:
        - { name: fs_conn_id, in: path, required: true, schema: { $ref: "#/components/schemas/ULID" } }
        - $ref: "#/components/parameters/Wait"
      responses:
        "200":
          description: Último veredito da conexão.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Verdict" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /bot/v1/probes/{id}/verdict:
    get:
      tags: [verdicts]
      operationId: getProbeVerdict
      summary: Veredito de um probe
      description: Avaliado sobre as conexões do probe vistas pelo espelho; domínio pelo `Origin`/`Referer` delas.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9]{8,32}$" } }
        - $ref: "#/components/parameters/Wait"
      responses:
        "200":
          description: Veredito do probe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Verdict" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /bot/v1/ip/{ip}:
    get:
      tags: [reputation]
      operationId: getIPReputation
      summary: Agregados de 7 dias de um IP nos domínios da chave
      parameters:
        - { name: ip, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Agregados e listas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IPReputation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /bot/v1/fingerprints/{kind}/{value}:
    get:
      tags: [reputation]
      operationId: getFingerprintStats
      summary: Contagens de 7 dias de uma fingerprint
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [ja4, akamai, ja4h, ja4t] } }
        - { name: value, in: path, required: true, schema: { type: string, maxLength: 512 } }
      responses:
        "200":
          description: Contagens por dia, família de UA e classe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FingerprintStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /bot/v1/stream:
    get:
      tags: [realtime]
      operationId: streamVerdicts
      summary: Feed SSE de vereditos
      description: |
        Cada evento SSE tem `event: verdict` (ou `stream.dropped`) e `data: <VerdictEvent>`. Sem replay; fila de
        1024 por cliente com descarte; ping a cada 15 s; até 64 clientes, dos quais no máximo 48 da 9002 e 4 por
        chave da 9002 (acima da parte da chave, 429 com `Retry-After: 15`; ADR 0073 item 3.3).
      parameters:
        - { name: class, in: query, schema: { type: string }, description: "Classes separadas por vírgula." }
        - { name: site, in: query, schema: { type: string } }
      responses:
        "200":
          description: Fluxo SSE.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404":
          description: |
            `site` fora dos domínios da chave (`not_found`, spec 020 RF-03), como nas outras rotas; sem `site`, o
            feed entrega os vereditos de todos os domínios da chave.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: Acima de 64 clientes do feed, ou dos 48 da 9002 (`internal`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /bot/v1/ingest/traefik:
    post:
      tags: [ingest]
      operationId: ingestTraefik
      summary: Envio em lote do traefix (spec 019 RF-06 e RF-07)
      description: |
        Dois esquemas, escolhidos pelo campo `schema` do lote (ADR 0062 item 2): `traefix.fingerprint/v1`
        (`TraefixFingerprintBatch`, cópia do esquema do traefix) ou ausente (`TraefikIngestBatch`, formato anterior mantido
        em `/bot/v1`). Outro valor de `schema` → 400 `bad_request`.

        Limites (spec 020 RF-04, ADR 0073 itens 2, 3 e 6): até 8 lotes em leitura e aplicação no processo, no máximo 6
        da 9002 (acima, 503 `busy` sem ler o corpo); na 9002, até 2 lotes por chave e balde de registros da chave
        (o lote tira `len(records)` fichas de uma vez; sem fichas, 429 e nenhum registro aplicado); o corpo tem 10 s
        para chegar (senão 400). Na 9003 não há limite de chave.

        Tetos dos textos do registro, em bytes (nos dois esquemas): o bot **corta** acima deles, sem recusar o
        registro, e conta em `bot_ingest_clipped_total{field}`. `method` 32; `http_version`/`httpVersion` 16;
        `authority` e `sni`/`tls.sni` 255; `entry_point`/`entryPoint`, `router`, `service` 128;
        `tls_version`/`tls.version` e `cipher`/`tls.cipher` 64; `alpn` e cada item de `alpn_offered`/`tls.alpnOffered`
        255, até 16 itens; cada item de `field_names`/`fieldNames` e `cookie_names`/`cookieNames` 64, até 128 itens;
        nome de campo em `fields` 64 (acima, o valor é descartado); valor de campo permitido 512; `ja4h` 128 (acima,
        tratado como ausente). `path` acima de 256 continua recusando o registro (`rejected`). Os tetos ficam neste
        texto e não como `maxLength` nos esquemas: o formato do traefix não fica mais estreito neste contrato.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - { $ref: "#/components/schemas/TraefixFingerprintBatch" }
                - { $ref: "#/components/schemas/TraefikIngestBatch" }
      responses:
        "202":
          description: Lote recebido; registros inválidos contados e ignorados.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, rejected]
                properties:
                  accepted: { type: integer, minimum: 0 }
                  rejected: { type: integer, minimum: 0 }
        "400":
          description: Lote inválido, `schema` desconhecido ou corpo que não chegou em 10 s (`bad_request`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/InvalidKey" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "413":
          description: Lote acima de 4 MiB (`payload_too_large`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: |
            Limite da chave, só na 9002 (`rate_limited`): balde ou cota por requisição, balde de registros sem fichas
            para o lote inteiro, ou 2 lotes da chave já em andamento.
          headers:
            Retry-After:
              description: Segundos até tentar de novo.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Sem vaga entre os lotes simultâneos (`busy`); o corpo não é lido.
          headers:
            Retry-After:
              description: Sempre 1.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

webhooks:
  verdict:
    post:
      tags: [realtime]
      operationId: verdictWebhook
      summary: Webhook de vereditos (ADR 0051 item 5)
      description: |
        Enviado à URL da chave para as classes escolhidas (padrão `bot` e `suspect`). Assinatura
        `X-Fs-Signature: sha256=<hex de HMAC-SHA256(segredo, X-Fs-Timestamp + "." + corpo)>`; prazo de 5 s; novas
        tentativas em 1 s, 5 s e 30 s em erro de rede ou 5xx; 4xx não repete.
      security: []
      parameters:
        - { name: X-Fs-Signature, in: header, required: true, schema: { type: string, pattern: "^sha256=[0-9a-f]{64}$" } }
        - { name: X-Fs-Timestamp, in: header, required: true, schema: { type: integer }, description: Segundos Unix. }
        - { name: X-Fs-Key-Prefix, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerdictEvent" }
      responses:
        "200": { description: Recebido (qualquer 2xx). }
        "400": { description: Recusado pelo receptor (4xx não repete). }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Chave `fsk_...` emitida pelo operador (ADR 0051).
  headers:
    XFsVerdict:
      description: Classe do veredito, ou `unavailable` (posto pelo traefix em fail-open).
      schema: { type: string, enum: [human, good_bot, bot, suspect, unknown, unavailable] }
    XFsScore:
      description: Score 0–100.
      schema: { type: integer, minimum: 0, maximum: 100 }
    XFsSignals:
      description: Ids dos sinais presentes, separados por vírgula (até 1 KiB).
      schema: { type: string }
    XFsVerdictDeprecated:
      description: Igual a `X-Traefix-Verdict` (obsoleto, sai na `/bot/v2`; ADR 0063 item 1).
      deprecated: true
      schema: { type: string, enum: [human, good_bot, bot, suspect, unknown] }
    XFsScoreDeprecated:
      description: Igual a `X-Traefix-Score` (obsoleto, ADR 0063 item 1).
      deprecated: true
      schema: { type: integer, minimum: 0, maximum: 100 }
    XFsSignalsDeprecated:
      description: Igual a `X-Traefix-Signals` (obsoleto, ADR 0063 item 1).
      deprecated: true
      schema: { type: string }
  parameters:
    Wait:
      name: wait
      in: query
      description: Milissegundos para esperar a visão que falta (0–1000).
      schema: { type: integer, minimum: 0, maximum: 1000 }
  responses:
    BadRequest:
      description: Parâmetro inválido (`bad_request`, `missing_fork_headers`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidKey:
      description: Chave ausente, desconhecida ou revogada (`invalid_key`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Desconhecido, expirado (10 min) ou fora dos domínios da chave (`not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ForbiddenOrigin:
      description: |
        Só na 9003: origem fora do loopback e das redes permitidas (`FS_BOT_INTERNAL_ALLOW`), em qualquer rota,
        inclusive `health` e `openapi.yaml` (`forbidden_origin`). Nunca na 9002.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Internal:
      description: Falha ao consultar o banco do bot (`internal`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Limite da chave (`rate_limited`).
      headers:
        Retry-After:
          description: Segundos até tentar de novo.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_key, rate_limited, not_found, bad_request, missing_fork_headers, payload_too_large, forbidden_origin, internal, busy, forbidden]
        detail: { type: string }
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC com nanossegundos.
    ULID:
      type: string
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    Base64:
      type: string
      contentEncoding: base64
    Endpoint:
      type: object
      required: [ip, port]
      properties:
        ip: { type: string }
        port: { type: integer, minimum: 0, maximum: 65535 }
    BotHealth:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        reasons: { type: array, items: { type: string } }
        rules_version: { type: string }
        lists_version: { type: string }
        lists:
          type: array
          items:
            type: object
            required: [name, entries]
            properties:
              name: { type: string }
              entries: { type: integer, minimum: 0 }
              fetched_at: { type: [string, "null"], format: date-time }
              stale: { type: boolean }
    Signal:
      type: object
      required: [id, kind, weight]
      properties:
        id:
          type: string
          description: Id estável (spec 018, tabela de pesos), ex. `ua_tls_mismatch`.
        kind: { type: string, enum: [incoherence, list, behavior] }
        weight: { type: integer, description: Peso aplicado (negativo para sinal de cliente legítimo). }
        detail: { type: string, description: Explicação legível (ex. família do UA e JA4 vistos). }
    View:
      type: object
      description: O que havia para decidir.
      required: [tcp, tls, http, h2, h3, behavior]
      properties:
        tcp: { type: boolean }
        tls: { type: boolean }
        http: { type: boolean }
        h2: { type: boolean }
        h3: { type: boolean }
        behavior: { type: boolean }
        parse_error: { type: boolean }
    Fingerprints:
      type: object
      properties:
        ja3: { type: [string, "null"] }
        ja3n: { type: [string, "null"] }
        ja4: { type: [string, "null"] }
        ja4_r: { type: [string, "null"] }
        ja4_o: { type: [string, "null"] }
        akamai: { type: [string, "null"] }
        ja4h: { type: [string, "null"] }
        ja4t: { type: [string, "null"] }
        p0f_os: { type: [string, "null"] }
        ttl_initial: { type: [integer, "null"] }
        tcp_rtt_us: { type: [integer, "null"], description: "Volta do handshake TCP medida pelo traefix (ADR 0065)." }
        tls_rtt_us: { type: [integer, "null"], description: "Volta do handshake TLS com o cliente TLS (ADR 0065)." }
        rtt_gap_us: { type: [integer, "null"], description: "`tls_rtt_us` − `tcp_rtt_us`; grande atrás de relay (ADR 0065)." }
        est_to_first_us: { type: [integer, "null"], description: "Accept → primeiro byte do cliente; pode ser negativo (ADR 0065)." }
        timing_source: { type: [string, "null"], enum: [kernel, user, null] }
        ua_family: { type: [string, "null"] }
        ua_os: { type: [string, "null"] }
    Subject:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [request, connection, probe] }
        site: { type: [string, "null"] }
        src: { $ref: "#/components/schemas/Endpoint" }
        dst_port: { type: [integer, "null"] }
        fs_conn_id: { type: [string, "null"], description: Id da conexão no traefix. }
        conn_id: { type: [string, "null"], description: "`conn_id` do store, quando casado." }
        probe_id: { type: [string, "null"] }
        method: { type: [string, "null"] }
        path: { type: [string, "null"], description: "Caminho sem query, até 256 bytes." }
    Verdict:
      type: object
      required: [class, score, signals, view, rules_version, lists_version, subject, ts]
      properties:
        class: { type: string, enum: [human, good_bot, bot, suspect, unknown] }
        score: { type: integer, minimum: 0, maximum: 100 }
        signals: { type: array, items: { $ref: "#/components/schemas/Signal" } }
        view: { $ref: "#/components/schemas/View" }
        fingerprints: { $ref: "#/components/schemas/Fingerprints" }
        crawler: { type: [string, "null"], description: "Nome do robô verificado (`good_bot`)." }
        rules_version: { type: string }
        lists_version: { type: string }
        subject: { $ref: "#/components/schemas/Subject" }
        ts: { $ref: "#/components/schemas/Timestamp" }
    VerdictEvent:
      type: object
      required: [kind, ts]
      properties:
        kind: { type: string, enum: [verdict, stream.dropped] }
        ts: { $ref: "#/components/schemas/Timestamp" }
        verdict: { $ref: "#/components/schemas/Verdict" }
        dropped: { type: integer, minimum: 1 }
    IPReputation:
      type: object
      required: [ip, days, lists]
      properties:
        ip: { type: string }
        days:
          type: array
          items:
            type: object
            required: [day, site, requests]
            properties:
              day: { type: string, format: date }
              site: { type: string }
              requests: { type: integer, minimum: 0 }
              conns: { type: integer, minimum: 0 }
              classes:
                type: object
                additionalProperties: { type: integer, minimum: 0 }
        lists: { type: array, items: { type: string }, description: Listas em que o IP está. }
        crawler_verified: { type: [string, "null"] }
    FingerprintStats:
      type: object
      required: [kind, value, days]
      properties:
        kind: { type: string, enum: [ja4, akamai, ja4h, ja4t] }
        value: { type: string }
        known_client: { type: [string, "null"], description: Cliente da base própria. }
        ja4db_label: { type: [string, "null"] }
        days:
          type: array
          items:
            type: object
            required: [day, ua_family, requests]
            properties:
              day: { type: string, format: date }
              ua_family: { type: string }
              requests: { type: integer, minimum: 0 }
              ips: { type: integer, minimum: 0 }
              class_bot: { type: integer, minimum: 0 }
              class_human: { type: integer, minimum: 0 }
    TraefikIngestBatch:
      type: object
      required: [records]
      description: Formato anterior do lote, sem o campo `schema`, mantido em `/bot/v1` (ADR 0062 item 2).
      properties:
        sender: { type: string, description: "Versão do remetente (formato anterior; o traefix manda `TraefixFingerprintBatch`)." }
        records:
          type: array
          maxItems: 1024
          items: { $ref: "#/components/schemas/TraefikRecord" }
    TraefikRecord:
      type: object
      required: [type, fs_conn_id, ts]
      description: |
        `type=connection`: dados da conexão (TLS e h2), uma vez por conexão; `type=request`: resumo de uma
        requisição (spec 019 RF-03 e RF-04). Tetos dos textos (cortados pelo bot): ver `ingestTraefik`.
      properties:
        type: { type: string, enum: [connection, request] }
        fs_conn_id: { $ref: "#/components/schemas/ULID" }
        ts: { $ref: "#/components/schemas/Timestamp" }
        src: { $ref: "#/components/schemas/Endpoint" }
        dst: { $ref: "#/components/schemas/Endpoint" }
        entry_point: { type: string }
        sni: { type: [string, "null"] }
        alpn_offered: { type: array, items: { type: string } }
        alpn: { type: [string, "null"] }
        tls_version: { type: [string, "null"] }
        cipher: { type: [string, "null"] }
        client_hello: { $ref: "#/components/schemas/Base64" }
        client_hello_truncated: { type: boolean }
        h2_prefix: { $ref: "#/components/schemas/Base64" }
        h2_prefix_truncated: { type: boolean }
        proto: { type: string, enum: [h1, h2, h3] }
        method: { type: string }
        authority: { type: string }
        path: { type: string, maxLength: 256 }
        http_version: { type: string }
        field_names: { type: array, items: { type: string } }
        fields:
          type: object
          description: Valores só dos campos permitidos (spec 019 RF-04).
          additionalProperties: { type: string, maxLength: 512 }
        cookie_names: { type: array, items: { type: string } }
        ja4h: { type: [string, "null"] }
        status: { type: [integer, "null"] }
        ended: { type: [string, "null"], format: date-time }
        router: { type: [string, "null"] }
        service: { type: [string, "null"] }
    TraefixFingerprintBatch:
      type: object
      required: [schema, sender, entryPoint, sentAt, records]
      description: |
        Lote `traefix.fingerprint/v1`, formato do projeto traefix. Tradução em componentes de
        `traefix-fingerprint-v1.schema.json` do traefix no commit `59c901c7b` (`fork-point-223`), copiado em
        `cmd/finger-sniffer-bot/traefix-fingerprint-v1.schema.json`; um teste do bot valida os lotes de exemplo
        contra as duas formas (ADR 0063 item 3). Diferença conhecida: `tcp.ja4t` aceita escala de janela de 1
        dígito (pedido PT-11 ao traefix). O bot ignora campos e tipos de registro desconhecidos e lê só o da
        spec 019 RF-07; aceita também registros que este esquema declararia incompletos, desde que tenham o que lê.
      properties:
        schema: { type: string, const: traefix.fingerprint/v1 }
        sender: { type: string, pattern: "^traefix/", description: "`traefix/fork-point-<n>-g<sha>`." }
        entryPoint: { type: string }
        sentAt: { $ref: "#/components/schemas/Timestamp" }
        records:
          type: array
          maxItems: 1024
          items:
            anyOf:
              - { $ref: "#/components/schemas/TraefixConnectionRecord" }
              - { $ref: "#/components/schemas/TraefixRequestRecord" }
              - { $ref: "#/components/schemas/TraefixUnknownRecord" }
    TraefixUnknownRecord:
      type: object
      required: [type]
      description: Tipo de registro acrescentado depois, ignorado pelo bot (`bot_ingest_ignored_total{type}`).
      properties:
        type: { type: string, not: { enum: [connection, request] } }
    TraefixJA4:
      type: string
      pattern: "^[tqd][0-9a-z?]{2}[di][0-9]{4}.{2}_[0-9a-f]{12}_[0-9a-f]{12}$"
    TraefixMD5:
      type: string
      pattern: "^[0-9a-f]{32}$"
    TraefixConnectionRecord:
      type: object
      required: [type, connId, time, entryPoint, src, dst]
      description: |
        Uma vez por conexão, na primeira requisição ou no fechamento sem requisição. Com `tls.clientHello`,
        `http2.prefix` e `tcp.syn` (`rawBytes`) o bot calcula as fingerprints; sem eles usa as prontas (ADRs 0062
        item 3 e 0063 itens 4 e 5). Tetos dos textos (cortados pelo bot): ver `ingestTraefik`.
      properties:
        type: { type: string, const: connection }
        connId: { $ref: "#/components/schemas/ULID" }
        time: { $ref: "#/components/schemas/Timestamp" }
        entryPoint: { type: string }
        src: { $ref: "#/components/schemas/Endpoint" }
        dst: { $ref: "#/components/schemas/Endpoint" }
        proto: { type: string, enum: [h1, h2, h3] }
        tls:
          type: object
          properties:
            sni: { type: string }
            alpnOffered: { type: array, items: { type: string } }
            alpn: { type: string }
            version: { type: string, description: "Nome IANA, ex.: `TLS 1.3`." }
            cipher: { type: string, description: Nome IANA. }
            ja3: { $ref: "#/components/schemas/TraefixMD5" }
            ja3String: { type: string, pattern: "^[0-9]+,[0-9-]*,[0-9-]*,[0-9-]*,[0-9-]*$" }
            ja3n: { $ref: "#/components/schemas/TraefixMD5" }
            ja3nString: { type: string, pattern: "^[0-9]+,[0-9-]*,[0-9-]*,[0-9-]*,[0-9-]*$" }
            ja4: { $ref: "#/components/schemas/TraefixJA4" }
            ja4r: { type: string, pattern: "^[tqd][0-9a-z?]{2}[di][0-9]{4}.{2}_" }
            ja4o: { $ref: "#/components/schemas/TraefixJA4" }
            clientHello:
              type: string
              contentEncoding: base64
              description: Com `rawBytes`; registros TLS em TCP, mensagem de handshake pura em QUIC.
            clientHelloTruncated: { type: boolean }
            quicTransportParameters: { type: array, items: { type: integer, minimum: 0 } }
        http2:
          type: object
          properties:
            akamai: { type: string, pattern: "^[^|]*\\|[^|]*\\|[^|]*\\|[^|]*$" }
            headersPriority: { type: string, pattern: "^[0-9]+:[01]:[0-9]+:[0-9]+$" }
            prefix: { type: string, contentEncoding: base64 }
            prefixTruncated: { type: boolean }
        http3:
          type: object
          properties:
            settings: { type: string }
        tcp:
          type: object
          required: [ttl]
          description: Com `fingerprint.tcp` (só Linux; ADR 0063 item 5).
          properties:
            ja4t: { type: string, pattern: "^[0-9]+_[0-9-]+_[0-9]{2,}_[0-9]+$" }
            p0f:
              type: string
              description: "`raw_sig` do p0f v3 (sem palpite de SO)."
              pattern: "^[46]:[0-9]+\\+[0-9?]+:[0-9]+:[0-9*]+:[^:]*,[0-9]+:[^:]*:[^:]*:[0+]$"
            ttl: { type: integer, minimum: 0, maximum: 255 }
            rttMicros: { type: integer, minimum: 0 }
            syn:
              type: string
              contentEncoding: base64
              description: SYN cru desde o cabeçalho IP (com `rawBytes`).
        udp:
          type: object
          description: IP do primeiro Initial do QUIC (h3; Linux, macOS, FreeBSD; ADR 0065 item 4).
          properties:
            ttl: { type: integer, minimum: 0, maximum: 255 }
            dscp: { type: integer, minimum: 0, maximum: 63 }
            ecn: { type: integer, minimum: 0, maximum: 3 }
        timing:
          type: object
          required: [source]
          description: Tempos do início da conexão, com `headerDetail` diferente de `basic` (ADR 0065 item 2).
          properties:
            source: { type: string, enum: [kernel, user] }
            firstByte: { $ref: "#/components/schemas/Timestamp" }
            tcpRttMicros: { type: integer, minimum: 0 }
            estToFirstMicros: { type: integer, description: Pode ser negativo. }
            clientHelloMicros: { type: integer }
            serverMicros: { type: integer }
            tlsRttMicros: { type: integer }
            handshakeMicros: { type: integer }
            rttGapMicros: { type: integer }
            initialToHandshakeMicros: { type: integer }
            quicRttMicros: { type: integer, minimum: 0 }
            quicMinRttMicros: { type: integer, minimum: 0 }
    TraefixRequestRecord:
      type: object
      required: [type, start, end, entryPoint, proto, method, path, httpVersion, status]
      description: |
        Uma por requisição, no fim da resposta. Tetos dos textos (cortados pelo bot): ver `ingestTraefik`. Sem
        `router` e com `status` 404, fica fora dos agregados (ADR 0073 item 7.3).
      properties:
        type: { type: string, const: request }
        connId: { $ref: "#/components/schemas/ULID" }
        start: { $ref: "#/components/schemas/Timestamp" }
        end: { $ref: "#/components/schemas/Timestamp" }
        entryPoint: { type: string }
        proto: { type: string, enum: [h1, h2, h3] }
        method: { type: string }
        authority: { type: string }
        path: { type: string, maxLength: 256, description: Sem query. }
        httpVersion: { type: string }
        fieldNames: { type: array, items: { type: string } }
        fields:
          type: array
          description: Na ordem recebida; o bot guarda o primeiro valor de cada nome da lista permitida.
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string }
              value: { type: string }
        cookieNames: { type: array, items: { type: string } }
        ja4h: { type: string, pattern: "^.{2}[0-9]{2}[cn][rn][0-9]{2}.+_[0-9a-f]{12}_[0-9a-f]{12}_[0-9a-f]{12}$" }
        headersTruncated: { type: boolean }
        status: { type: integer, minimum: 0, maximum: 999, description: "`0` quando a conexão foi assumida." }
        router: { type: string }
        service: { type: string }
