openapi: 3.1.0
info:
  title: finger-sniffer API
  version: 0.4.1
  summary: Espelho de análise de conexões.
  description: |
    API do espelho de análise de conexões (spec 004). Sem autenticação (ADR 0007): todo o tráfego
    registrado é público por até 10 minutos (ADR 0012).

    Servida em 9000 (HTTPS) e 9001 (HTTP), portas fora da captura. CORS `*`. Nomes em inglês.
    Tempos em RFC 3339 UTC com nanossegundos. Durações relativas em milissegundos (float) contadas a
    partir de `times.syn` (TCP) ou do primeiro datagrama (UDP), salvo quando indicado.

    Compatibilidade (ADR 0001): `/api/v1` só recebe mudanças aditivas. 0.4.0 (ADR 0029, aditivo): instantes
    de cada requisição e resposta (`request_started_at`, `request_ended_at`, `response_started_at`,
    `response_ended_at`), `ip.packets`, `settle`/`min_conns` no `wait` e `wait_met` no probe. 0.4.1 (documental):
    quando cada instante é nulo e `wait=0s` como `wait` válido.

    Instantes por requisição: cada um é independente dos outros; nulo = o web não observou aquele momento.
    O fim da requisição pode existir sem o início da resposta e vice-versa.

    Erros (corpo `Error`): `400` quando um parâmetro de consulta **ou de caminho** foge do formato declarado
    (ex. `conn_id` que não é ULID, probe ID fora de `^[a-z0-9]{8,32}$`, `dir` ausente); `404` quando o ID tem o
    formato certo mas é desconhecido ou expirou, e para qualquer rota inexistente; `500` em erro interno das
    rotas de consulta. `OPTIONS` em qualquer caminho responde `204` sem corpo (pré-voo CORS).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
# Sem autenticação (ADR 0007).
security: []
servers:
  - url: https://vps602.tmsoft.com.br:9000
    description: HTTPS (mesmo certificado do espelho)
  - url: http://vps602.tmsoft.com.br:9001
    description: HTTP
tags:
  - name: health
    description: Saúde e contrato.
  - name: probes
    description: Agrupamento por probe ID.
  - name: connections
    description: Conexões TCP/UDP registradas.
  - name: dns
    description: Consultas DNS da zona.
  - name: packets
    description: Pacotes avulsos.
  - name: realtime
    description: Eventos ao vivo.
paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Saúde agregada por serviço
      responses:
        "200":
          description: Estado de cada serviço e do host. `ok` é false se algum serviço estiver `down`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              examples:
                # Gerado pelo próprio handler (internal/store TestHealthExample) e validado contra o schema
                # no verify (redocly, no-invalid-media-type-examples).
                all_up: { $ref: "./testdata/health-example.json" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/probes/{id}:
    parameters:
      - $ref: "#/components/parameters/ProbeIDPath"
    get:
      tags: [probes]
      operationId: getProbe
      summary: Conexões e consultas DNS de um probe
      parameters:
        - name: wait
          in: query
          description: |
            Long-poll (duração Go, máx. 60s): responde quando o probe tem **ao menos uma conexão** e todas
            estão fechadas, ou quando o prazo acaba. Só consultas DNS (ou nada) ainda não bastam: a espera
            continua até a primeira conexão chegar e fechar. No fim do prazo devolve o estado atual (200, com
            `all_closed` refletindo as conexões existentes) ou 404 se o probe ainda não tem nada. Sem `wait`,
            responde na hora. `wait=0s` é um `wait` válido: avalia o critério uma vez, responde na hora e traz
            `wait_met`. Com `min_conns` e `settle` (ADR 0029) o critério fica mais estrito; a resposta traz
            `wait_met`.
          schema: { type: string, pattern: "^[0-9]+(ms|s)$", examples: ["10s"] }
        - name: settle
          in: query
          description: |
            Só com `wait` (sem ele: 400). Duração Go de `0s` a `10s` (padrão `0s`, igual ao comportamento sem o
            parâmetro): além do critério do `wait`, nenhuma conexão do probe pode ter sido criada,
            correlacionada ao probe ou fechada nos últimos `settle` (relógio do store, a partir do instante em
            que ele registrou a mudança). Cobre a conexão que chega logo depois e a que ainda não foi
            correlacionada (até 500 ms, RNF-04). Uso recomendado para o conjunto completo: `wait=30s&settle=1s`.
            Acima de `10s` ou fora do formato: 400.
          schema: { type: string, pattern: "^[0-9]+(ms|s)$", default: "0s", examples: ["1s", "1500ms"] }
        - name: min_conns
          in: query
          description: |
            Só com `wait` (sem ele: 400). O critério do `wait` exige ao menos esta quantidade de conexões no
            probe (padrão 1, o comportamento sem o parâmetro).
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
      responses:
        "200":
          description: Probe completo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Probe" }
              examples:
                probe: { $ref: "./testdata/probe-example.json" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [probes]
      operationId: deleteProbe
      summary: Apaga o probe, suas conexões e consultas DNS
      responses:
        "204": { description: Apagado. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/connections:
    get:
      tags: [connections]
      operationId: listConnections
      summary: Lista resumida de conexões, mais novas primeiro
      parameters:
        - { name: src_ip, in: query, schema: { type: string } }
        - { name: dst_port, in: query, schema: { type: integer, minimum: 0, maximum: 65535 } }
        - { name: since, in: query, schema: { $ref: "#/components/schemas/Timestamp" } }
        - { name: until, in: query, schema: { $ref: "#/components/schemas/Timestamp" } }
        - { name: probe, in: query, schema: { $ref: "#/components/schemas/ProbeID" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: Conexões que casam com os filtros.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectionSummary" }
              examples:
                two: { $ref: "./testdata/connections-list-example.json" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/connections/{conn_id}:
    parameters:
      - $ref: "#/components/parameters/ConnIDPath"
    get:
      tags: [connections]
      operationId: getConnection
      summary: Registro completo de uma conexão (specs 008–013)
      responses:
        "200":
          description: Registro completo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
              examples:
                closed_http: { $ref: "./testdata/connection-example.json" }
                quic_h3: { $ref: "./testdata/connection-quic-example.json" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/connections/{conn_id}/pcap:
    parameters:
      - $ref: "#/components/parameters/ConnIDPath"
    get:
      tags: [connections]
      operationId: getConnectionPcap
      summary: pcap da conexão (dois sentidos)
      responses:
        "200":
          description: Arquivo pcap (libpcap, nanossegundos). Se `pcap_truncated`, pacotes além do teto vêm só com cabeçalhos.
          content:
            application/vnd.tcpdump.pcap:
              schema: { type: string, contentMediaType: application/vnd.tcpdump.pcap }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/connections/{conn_id}/raw:
    parameters:
      - $ref: "#/components/parameters/ConnIDPath"
      - name: dir
        in: query
        required: true
        description: "`in` = o que o cliente mandou; `out` = o que o espelho mandou."
        schema: { type: string, enum: [in, out] }
    get:
      tags: [connections]
      operationId: getConnectionRaw
      summary: Bytes de aplicação de um sentido
      responses:
        "200":
          description: Bytes crus (depois do TLS, quando houver).
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/dns:
    get:
      tags: [dns]
      operationId: listDNSQueries
      summary: Consultas DNS recebidas pela zona
      parameters:
        - { name: probe, in: query, schema: { $ref: "#/components/schemas/ProbeID" } }
        - { name: since, in: query, schema: { $ref: "#/components/schemas/Timestamp" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: Consultas, mais novas primeiro.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DNSQuery" }
              examples:
                with_ecs: { $ref: "./testdata/dns-list-example.json" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/packets:
    get:
      tags: [packets]
      operationId: listStrayPackets
      summary: Pacotes que não formam conexão (SYN sem resposta, RST avulso, ICMP, UDP solto)
      parameters:
        - { name: since, in: query, schema: { $ref: "#/components/schemas/Timestamp" } }
        - { name: until, in: query, schema: { $ref: "#/components/schemas/Timestamp" } }
        - { name: src_ip, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: Pacotes avulsos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StrayPacket" }
              examples:
                rst: { $ref: "./testdata/packets-example.json" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/stream:
    get:
      tags: [realtime]
      operationId: streamEvents
      summary: Tempo real por Server-Sent Events
      description: |
        Cada evento SSE tem `event: <kind>` e `data: <LiveEvent em JSON>`. Sem filtros = feed global.
        Só eventos novos (sem replay nem `Last-Event-ID`); comentário `: ping` a cada 15 s. Cliente lento
        perde eventos e recebe um `stream.dropped` com a contagem (spec 004, ADR 0020).
      parameters:
        - $ref: "#/components/parameters/LiveProbe"
        - $ref: "#/components/parameters/LiveSrcIP"
        - $ref: "#/components/parameters/LiveDstPort"
        - $ref: "#/components/parameters/LiveKind"
      responses:
        "200":
          description: Fluxo SSE; cada `data` é um LiveEvent.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/TooManyLiveClients" }

  /api/v1/ws:
    get:
      tags: [realtime]
      operationId: websocketEvents
      summary: Tempo real por WebSocket
      description: |
        Mesmos filtros e regras do `/stream`; cada mensagem de texto é um LiveEvent em JSON. O servidor manda
        ping a cada 30 s e ignora mensagens do cliente.
      parameters:
        - $ref: "#/components/parameters/LiveProbe"
        - $ref: "#/components/parameters/LiveSrcIP"
        - $ref: "#/components/parameters/LiveDstPort"
        - $ref: "#/components/parameters/LiveKind"
      responses:
        "101": { description: Switching Protocols. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/TooManyLiveClients" }

  /api/v1/openapi.yaml:
    get:
      tags: [health]
      operationId: getOpenAPI
      summary: Este contrato
      responses:
        "200":
          description: OpenAPI em YAML.
          content:
            application/yaml:
              schema: { type: string }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  parameters:
    ProbeIDPath:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ProbeID" }
    ConnIDPath:
      name: conn_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ConnID" }
    LiveProbe: { name: probe, in: query, schema: { $ref: "#/components/schemas/ProbeID" } }
    LiveSrcIP: { name: src_ip, in: query, schema: { type: string } }
    LiveDstPort: { name: dst_port, in: query, schema: { type: integer, minimum: 0, maximum: 65535 } }
    LiveKind:
      name: kind
      in: query
      description: Lista separada por vírgula de `LiveEvent.kind`.
      schema: { type: string }

  responses:
    BadRequest:
      description: Parâmetro inválido.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Desconhecido ou expirado (retenção de 10 min).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyLiveClients:
      description: Acima de `FS_LIVE_MAX_CLIENTS` clientes de tempo real simultâneos (SSE + WS).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Erro interno.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ------------------------------------------------------------------ básicos
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC com nanossegundos.
      examples: ["2026-11-07T12:00:00.000000123Z"]
    NullableTimestamp:
      type: [string, "null"]
      format: date-time
    ProbeID:
      type: string
      pattern: "^[a-z0-9]{8,32}$"
    ConnID:
      type: string
      description: ULID.
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    Base64:
      type: string
      contentEncoding: base64
    Hex:
      type: string
      pattern: "^([0-9a-f]{2})*$"
    Endpoint:
      type: object
      required: [ip, port]
      properties:
        ip: { type: string }
        port: { type: integer, minimum: 0, maximum: 65535 }
    TimedLength:
      type: array
      description: "[t_ms, bytes]"
      prefixItems:
        - { type: number }
        - { type: integer, minimum: 0 }
      minItems: 2
      maxItems: 2
    CodeName:
      type: object
      required: [code]
      properties:
        code: { type: integer }
        name: { type: string, description: "Nome IANA legível, quando conhecido." }
        grease: { type: boolean }

    # ------------------------------------------------------------------ health
    Health:
      type: object
      required: [ok, version, services]
      properties:
        ok: { type: boolean }
        version: { type: string }
        versions_match: { type: boolean, description: false se algum serviço roda versão diferente. }
        services:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ServiceHealth" }
        host: { $ref: "#/components/schemas/HostHealth" }
    ServiceHealth:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        version: { type: string }
        commit: { type: string }
        last_heartbeat: { $ref: "#/components/schemas/NullableTimestamp" }
        reasons: { type: array, items: { type: string } }
        metrics:
          type: object
          additionalProperties: { type: number }
    HostHealth:
      type: object
      properties:
        kernel: { type: string }
        iface: { type: string }
        mtu: { type: integer }
        offloads:
          type: object
          additionalProperties: { type: string, enum: ["on", "off", unknown] }
        aggregating_offload: { type: boolean }
        sysctls:
          type: object
          additionalProperties: { type: string }
        syncookies_sent: { type: integer, description: Contador do kernel (TcpExtSyncookiesSent). }
        conntrack_loaded: { type: boolean }
        nft_ruleset_lines: { type: integer }
        ntp_synchronized: { type: boolean }
        tls_server:
          type: object
          description: Configuração TLS fixa do espelho (spec 008 RF-06).
          properties:
            min_version: { type: string }
            max_version: { type: string }
            cipher_suites: { type: array, items: { type: string } }
        certificates:
          type: array
          items:
            type: object
            properties:
              names: { type: array, items: { type: string } }
              issuer: { type: string }
              not_after: { $ref: "#/components/schemas/Timestamp" }
              self_signed: { type: boolean }
        store:
          type: object
          properties:
            db_bytes: { type: integer }
            max_bytes: { type: integer }
            retention: { type: string }
            connections: { type: integer }
            oldest: { $ref: "#/components/schemas/NullableTimestamp" }

    # ------------------------------------------------------------------ probe e conexões
    Probe:
      type: object
      required: [probe_id, connections, dns]
      properties:
        probe_id: { $ref: "#/components/schemas/ProbeID" }
        all_closed: { type: boolean, description: true quando todas as conexões do probe terminaram. }
        wait_met:
          type: boolean
          description: |
            Só nas respostas com o parâmetro `wait`, inclusive `wait=0s` (ADR 0029): `true` quando a resposta saiu porque o critério (`min_conns`
            conexões, todas fechadas, `settle` de silêncio) foi atendido; `false` quando saiu pelo fim do prazo.
        connections: { type: array, items: { $ref: "#/components/schemas/Connection" } }
        dns: { type: array, items: { $ref: "#/components/schemas/DNSQuery" } }

    ConnectionSummary:
      type: object
      required: [conn_id, proto, l4, family, src, dst, started]
      properties:
        conn_id: { $ref: "#/components/schemas/ConnID" }
        probe_id: { type: [string, "null"], pattern: "^[a-z0-9]{8,32}$" }
        proto:
          type: string
          description: |
            Pilha detectada (regra na spec 004), ex. `tcp`, `udp`, `http1.1`, `h2c`, `tls/http1.1`, `tls/h2`,
            `tls/http1.1/ws`, `quic` (Initial sem h3 negociado), `quic/h3`, `tls/raw`, `raw`, `raw/unknown`,
            `dns`.
        l4: { type: string, enum: [tcp, udp] }
        family: { type: integer, enum: [4, 6] }
        src: { $ref: "#/components/schemas/Endpoint" }
        dst: { $ref: "#/components/schemas/Endpoint" }
        started: { $ref: "#/components/schemas/Timestamp" }
        ended: { $ref: "#/components/schemas/NullableTimestamp" }
        requests: { type: integer, description: Requisições HTTP (h1/h2/h3) na conexão. }
        degraded: { type: boolean }

    Connection:
      allOf:
        - $ref: "#/components/schemas/ConnectionSummary"
        - type: object
          properties:
            pcap_truncated: { type: boolean }
            raw_truncated:
              type: object
              description: Sentidos cujo fluxo de aplicação passou de FS_RAW_STREAM_MAX_BYTES (ADR 0018).
              properties:
                in: { type: boolean }
                out: { type: boolean }
            offload_suspect: { type: boolean, description: Algum pacote veio maior que MTU + 14. }
            times: { $ref: "#/components/schemas/Times" }
            close: { $ref: "#/components/schemas/Close" }
            totals: { $ref: "#/components/schemas/Totals" }
            ip: { $ref: "#/components/schemas/IPInfo" }
            tcp: { $ref: "#/components/schemas/TCPInfo" }
            tls: { $ref: "#/components/schemas/TLSInfo" }
            http: { type: array, items: { $ref: "#/components/schemas/HTTP1Request" } }
            http2: { $ref: "#/components/schemas/HTTP2Info" }
            http3: { $ref: "#/components/schemas/HTTP3Info" }
            websocket: { $ref: "#/components/schemas/WebSocketInfo" }
            raw: { $ref: "#/components/schemas/RawInfo" }

    Times:
      type: object
      description: Spec 013 RF-01.
      properties:
        syn: { $ref: "#/components/schemas/NullableTimestamp" }
        syn_ack: { $ref: "#/components/schemas/NullableTimestamp" }
        established: { $ref: "#/components/schemas/NullableTimestamp" }
        tls_done: { $ref: "#/components/schemas/NullableTimestamp" }
        first_data: { $ref: "#/components/schemas/NullableTimestamp" }
        client_fin: { $ref: "#/components/schemas/NullableTimestamp" }
        server_fin: { $ref: "#/components/schemas/NullableTimestamp" }
        client_rst: { $ref: "#/components/schemas/NullableTimestamp" }
        server_rst: { $ref: "#/components/schemas/NullableTimestamp" }
        end: { $ref: "#/components/schemas/NullableTimestamp" }

    Close:
      type: object
      description: Spec 013 RF-02.
      properties:
        by: { type: string, enum: [client, server, unknown] }
        how:
          type: string
          enum: [fin, rst, timeout, open, quic_close]
          description: "`quic_close`: CONNECTION_CLOSE (ou reset sem estado) visto pelo web (spec 011); `timeout`: ociosidade."

        idle_before_close_ms: { type: [number, "null"] }
        half_close: { type: boolean }

    DirectionTotals:
      type: object
      properties:
        app_bytes: { type: integer }
        segments: { type: integer }
        data_segments: { type: integer }
        retransmits: { type: integer }
        out_of_order: { type: integer }
    Totals:
      type: object
      properties:
        in: { $ref: "#/components/schemas/DirectionTotals" }
        out: { $ref: "#/components/schemas/DirectionTotals" }

    IPInfo:
      type: object
      description: |
        Spec 013 RF-04/RF-05. Os campos planos são o resumo da conexão: TTL, DF, IP ID, opções e flow label do
        SYN; TOS/DSCP/ECN/traffic class do primeiro segmento com dados; padrão de IP ID e fragmentação de todos.
        `packets` traz os dados de cada pacote do handshake e do primeiro com dados (0.4.0, ADR 0029).
      properties:
        ttl: { type: integer, description: TTL (IPv4) ou hop limit (IPv6) observado. }
        ttl_initial: { type: integer, enum: [32, 64, 128, 255] }
        hops: { type: integer }
        ip_id_syn: { type: [integer, "null"] }
        ip_id_pattern: { type: string, enum: [zero, incremental, random, constant, unknown] }
        df: { type: boolean }
        tos: { type: integer }
        dscp: { type: integer }
        ecn: { type: string, enum: [not-ect, ect0, ect1, ce] }
        options_hex: { $ref: "#/components/schemas/Hex" }
        fragmented: { type: boolean }
        flow_label: { type: [integer, "null"] }
        traffic_class: { type: [integer, "null"] }
        packets:
          type: object
          description: |
            Cabeçalho IP de cada pacote do cliente (nulo se o pacote não existiu). `syn`: primeiro SYN
            (retransmissão não substitui); `ack`: primeiro segmento com ACK e sem SYN depois do SYN-ACK, com ou sem
            dados; `first_data`: primeiro segmento com dados (pode ser o próprio SYN, com TFO, ou o próprio
            `ack`). Em UDP `syn` e `ack` são nulos e `first_data` é o primeiro datagrama. Os instantes estão em
            `times.syn`, `times.established` e `times.first_data`. Ausente em registros anteriores ao 0.4.0.
          properties:
            syn: { $ref: "#/components/schemas/IPPacket" }
            ack: { $ref: "#/components/schemas/IPPacket" }
            first_data: { $ref: "#/components/schemas/IPPacket" }
    IPPacket:
      type: [object, "null"]
      description: Cabeçalho IP de um pacote (ADR 0029).
      properties:
        ttl: { type: integer, description: TTL (IPv4) ou hop limit (IPv6). }
        df: { type: [boolean, "null"], description: Bit DF (IPv4); nulo no IPv6. }
        ip_id: { type: [integer, "null"], description: Identification (IPv4); nulo no IPv6. }
        tos: { type: integer, description: Byte TOS (IPv4) ou traffic class (IPv6). }
        dscp: { type: integer }
        ecn: { type: string, enum: [not-ect, ect0, ect1, ce] }
        flow_label: { type: [integer, "null"], description: Flow label (IPv6); nulo no IPv4. }
        total_length: { type: integer, description: "Total Length (IPv4) ou 40 + Payload Length (IPv6)." }
        options_hex: { $ref: "#/components/schemas/Hex", description: Opções IPv4 em hex; vazio sem opções e no IPv6. }
        fragmented: { type: boolean, description: "IPv4: MF ou offset ≠ 0; IPv6: cabeçalho Fragment." }

    TCPOption:
      type: array
      description: |
        Uma opção TCP na ordem em que chegou: `[kind, valores...]`. Ex.: `["mss",1460]`, `["nop"]`,
        `["wscale",7]`, `["sack_perm"]`, `["ts",123456,0]`, `["tfo","<hex>"]`, `["eol"]`, `["md5","<hex>"]`,
        `["unknown",<código>,"<hex>"]`.
      prefixItems:
        - type: string
          enum: [mss, nop, wscale, sack_perm, sack, ts, tfo, eol, md5, mptcp, unknown]
      minItems: 1
    TCPSyn:
      type: object
      properties:
        src_port: { type: integer }
        isn: { type: integer }
        window: { type: integer }
        flags: { type: string, description: "Letras S, A, F, R, P, U, E (ECE), C (CWR)." }
        urgent_ptr: { type: integer }
        header_len: { type: integer }
        options: { type: array, items: { $ref: "#/components/schemas/TCPOption" } }
        payload_b64: { type: [string, "null"], contentEncoding: base64, description: Dados no SYN (TFO). }
        tfo: { type: boolean }
    TCPInfo:
      type: object
      description: Spec 013 RF-06..RF-12.
      properties:
        syn: { $ref: "#/components/schemas/TCPSyn" }
        ja4t: { type: [string, "null"], description: "FoxIO License 1.1 (ADR 0010)." }
        p0f: { type: [string, "null"] }
        os_guess: { type: [string, "null"] }
        window_series:
          type: array
          description: "[t_ms, janela com escala aplicada] a cada mudança, sentido in."
          items: { $ref: "#/components/schemas/TimedLength" }
        ack_pattern: { type: string, enum: [delayed, immediate, mixed, unknown] }
        psh_used: { type: boolean }
        keepalive_probes: { type: array, items: { $ref: "#/components/schemas/TimedLength" } }
        zero_window: { type: boolean }
        rst_with_data: { type: boolean }
        segments_in: { type: array, items: { $ref: "#/components/schemas/TimedLength" } }
        segments_out: { type: array, items: { $ref: "#/components/schemas/TimedLength" } }
        ts_clock_hz: { type: [number, "null"] }
        ts_initial: { type: [integer, "null"] }
        ts_clock_group: { type: [string, "null"], description: Conexões com o mesmo valor vêm do mesmo relógio (host). }
        rtt_handshake_ms: { type: [number, "null"] }
        rtt_app_ms: { type: [number, "null"] }
        syn_cookie_server: { type: boolean }
        retransmits_in: { type: integer }

    # ------------------------------------------------------------------ TLS
    TLSExtension:
      type: object
      required: [type]
      properties:
        type: { type: integer }
        name: { type: string }
        grease: { type: boolean }
        data_hex: { $ref: "#/components/schemas/Hex" }
    TLSInfo:
      type: object
      description: Spec 008.
      properties:
        client_hello_b64: { $ref: "#/components/schemas/Base64" }
        client_hello_truncated: { type: boolean, description: "Inline cortado em FS_EVENT_INLINE_MAX (ADR 0018)." }
        client_hello_records: { type: integer }
        client_hello_segments: { type: integer }
        record_version: { type: integer }
        handshake_version: { type: integer }
        random_hex: { $ref: "#/components/schemas/Hex" }
        session_id_len: { type: integer }
        cipher_suites: { type: array, items: { $ref: "#/components/schemas/CodeName" } }
        compression_methods: { type: array, items: { type: integer } }
        extensions: { type: array, items: { $ref: "#/components/schemas/TLSExtension" } }
        sni: { type: [string, "null"] }
        alpn: { type: array, items: { type: string } }
        supported_groups: { type: array, items: { $ref: "#/components/schemas/CodeName" } }
        ec_point_formats: { type: array, items: { type: integer } }
        signature_algorithms: { type: array, items: { $ref: "#/components/schemas/CodeName" } }
        supported_versions: { type: array, items: { $ref: "#/components/schemas/CodeName" } }
        key_share:
          type: array
          items:
            type: object
            properties:
              group: { $ref: "#/components/schemas/CodeName" }
              length: { type: integer }
        psk_key_exchange_modes: { type: array, items: { type: integer } }
        pre_shared_key: { type: boolean }
        early_data: { type: boolean }
        padding_len: { type: [integer, "null"] }
        compress_certificate: { type: array, items: { type: integer } }
        record_size_limit: { type: [integer, "null"] }
        alps: { type: array, items: { type: string } }
        encrypted_client_hello: { type: boolean }
        session_ticket: { type: boolean }
        status_request: { type: boolean }
        delegated_credentials: { type: array, items: { $ref: "#/components/schemas/CodeName" } }
        ja3: { type: string }
        ja3_md5: { type: string }
        ja3n: { type: string }
        ja3n_md5: { type: string }
        ja4: { type: string }
        ja4_r: { type: string }
        ja4_o: { type: string }
        ja4_stable: { type: string }
        negotiated:
          type: [object, "null"]
          properties:
            version: { type: string }
            cipher: { type: string }
            group: { type: string }
            alpn: { type: [string, "null"] }
            resumed: { type: boolean }
        handshake_ms: { type: [number, "null"] }
        alerts:
          type: array
          description: |
            Alertas do handshake dos dois sentidos (spec 008 RF-04, ADR 0029): primeiro os registros `0x15` em
            texto claro vistos nos bytes de cada sentido, com nível e descrição exatos, na ordem; depois o alerta
            que o `crypto/tls` informar (cifrado, invisível nos bytes: `in` recebido, `out` enviado), só se não
            houver um igual (mesma direção e descrição) vindo dos bytes.
          items:
            type: object
            properties:
              dir: { type: string, enum: [in, out] }
              level: { type: integer }
              description: { type: integer }
              name: { type: string }

    # ------------------------------------------------------------------ HTTP/1
    HTTPField:
      type: array
      description: "`[nome na caixa original, separador literal, valor, terminador]`."
      prefixItems:
        - { type: string }
        - { type: string }
        - { type: string }
        - { type: string, enum: [crlf, lf] }
      minItems: 4
      maxItems: 4
    ProxySignal:
      type: object
      required: [kind]
      properties:
        kind: { type: string, examples: [via, forwarded, x-forwarded-for, proxy-authorization, absolute-form-direct, host-sni-mismatch] }
        field: { type: [string, "null"] }
        detail: { type: [string, "null"] }
    Controls:
      type: object
      description: Controles de resposta aplicados (spec 005 RF-07).
      properties:
        params:
          type: object
          additionalProperties: { type: string }
        clamped: { type: array, items: { type: string }, description: Parâmetros reduzidos ao teto. }
        invalid: { type: array, items: { type: string } }
    HTTP1Request:
      type: object
      description: Spec 009.
      required: [index, raw_head_b64, request_line, fields]
      properties:
        index: { type: integer }
        in_offset: { type: integer, description: "Início da requisição no fluxo `in` (`/raw?dir=in`, ADR 0018)." }
        out_offset: { type: [integer, "null"], description: "Início da resposta no fluxo `out`." }
        raw_head_b64: { $ref: "#/components/schemas/Base64" }
        raw_head_truncated: { type: boolean, description: "Inline cortado em FS_EVENT_INLINE_MAX (ADR 0018)." }
        request_line:
          type: object
          properties:
            method: { type: string }
            target: { type: string }
            form: { type: string, enum: [origin, absolute, authority, asterisk] }
            version: { type: string }
            terminator: { type: string, enum: [crlf, lf] }
        fields: { type: array, items: { $ref: "#/components/schemas/HTTPField" } }
        fields_truncated: { type: boolean, description: "Lista cortada para caber no teto do evento (ADR 0018)." }
        field_count: { type: integer }
        head_size: { type: integer }
        obs_fold: { type: boolean }
        duplicates: { type: array, items: { type: string } }
        head_too_large: { type: boolean }
        body:
          type: object
          properties:
            framing: { type: string, enum: [none, content-length, chunked, close] }
            size: { type: integer }
            sha256: { type: [string, "null"] }
            raw_b64: { type: [string, "null"], contentEncoding: base64, description: Até FS_RAW_BODY_MAX_BYTES (128 KiB). }
            raw_truncated: { type: boolean }
            chunks:
              type: array
              items:
                type: object
                properties:
                  size: { type: integer }
                  size_literal: { type: string }
                  ext: { type: [string, "null"] }
            chunks_truncated:
              type: boolean
              description: "Só os primeiros 4096 pedaços estão em `chunks` (teto do parser; tamanho e SHA-256 seguem do corpo inteiro)."
            trailers: { type: array, items: { $ref: "#/components/schemas/HTTPField" } }
        expect_continue:
          type: [object, "null"]
          properties:
            waited: { type: boolean }
            wait_ms: { type: [number, "null"] }
        pipelined: { type: boolean }
        upgrade: { type: [string, "null"], enum: [h2c, websocket, null] }
        t_first_byte_ms: { type: [number, "null"], description: Do fim do handshake TCP/TLS até o primeiro byte. }
        t_since_prev_response_ms: { type: [number, "null"] }
        proxy_signals: { type: array, items: { $ref: "#/components/schemas/ProxySignal" } }
        ja4h: { type: [string, "null"], description: "FoxIO License 1.1 (ADR 0010)." }
        controls: { $ref: "#/components/schemas/Controls" }
        status: { type: integer }
        response_sent_b64: { $ref: "#/components/schemas/Base64" }
        response_sent_truncated: { type: boolean, description: "Inline cortado em FS_EVENT_INLINE_MAX (ADR 0018)." }
        response_sent_size: { type: integer, description: Bytes enviados na resposta inteira (1xx incluídos). }
        request_started_at:
          $ref: "#/components/schemas/NullableTimestamp"
          description: "O web leu o primeiro byte da linha de requisição (em pipeline: a leitura que o trouxe). Relógio do web, instante da aplicação (em TLS/QUIC: decifrado, antes de cifrar); ausente antes do 0.4.0 (ADR 0029)."
        request_ended_at:
          $ref: "#/components/schemas/NullableTimestamp"
          description: "O web leu o último byte da requisição (fim do corpo/trailers, ou do cabeçalho sem corpo); nulo se não terminou."
        response_started_at:
          $ref: "#/components/schemas/NullableTimestamp"
          description: "O web escreveu o primeiro byte da resposta (1xx incluídos); nulo se nada foi enviado."
        response_ended_at:
          $ref: "#/components/schemas/NullableTimestamp"
          description: "O web escreveu o último byte da resposta; nulo se nada foi enviado ou se a resposta começou mas não terminou (conexão caiu no meio). Independente dos outros instantes."

    # ------------------------------------------------------------------ HTTP/2
    HPACKField:
      type: object
      properties:
        name: { type: string }
        value: { type: string }
        repr: { type: string, enum: [indexed, literal-indexed, literal-not-indexed, literal-never-indexed] }
        index: { type: [integer, "null"] }
        huffman_name: { type: [boolean, "null"] }
        huffman_value: { type: [boolean, "null"] }
    H2Frame:
      type: object
      properties:
        dir: { type: string, enum: [in, out] }
        t_ms: { type: number }
        type: { type: string }
        flags: { type: integer }
        stream_id: { type: integer }
        length: { type: integer }
    HTTP2Stream:
      type: object
      properties:
        stream_id: { type: integer }
        pseudo_order: { type: array, items: { type: string } }
        fields: { type: array, items: { $ref: "#/components/schemas/HPACKField" } }
        fields_truncated: { type: boolean, description: "Lista de campos cortada para caber no teto do evento (ADR 0018)." }
        values_truncated:
          type: boolean
          description: "Algum `value` foi cortado (no máximo FS_EVENT_INLINE_MAX, menos se preciso) para caber no teto do evento (ADR 0018)."
        priority:
          type: [object, "null"]
          properties:
            exclusive: { type: boolean }
            depends_on: { type: integer }
            weight: { type: integer }
        end_stream: { type: boolean }
        ja4h: { type: [string, "null"], description: "FoxIO License 1.1 (ADR 0010)." }
        status: { type: integer }
        controls: { $ref: "#/components/schemas/Controls" }
        request_started_at:
          $ref: "#/components/schemas/NullableTimestamp"
          description: "HEADERS do cliente lido; nulo no stream 1 de h2c por Upgrade (a requisição está em `http[]`). Relógio do web, instante da aplicação (em TLS/QUIC: decifrado, antes de cifrar); ausente antes do 0.4.0 (ADR 0029)."
        request_ended_at:
          $ref: "#/components/schemas/NullableTimestamp"
          description: "END_STREAM do cliente lido; nulo se não veio (ou no stream 1 de h2c por Upgrade)."
        response_started_at:
          $ref: "#/components/schemas/NullableTimestamp"
          description: "Primeiro HEADERS do servidor no stream escrito (1xx incluídos); nulo se nenhum HEADERS saiu (ex. RST_STREAM antes da resposta). Independente dos outros instantes."
        response_ended_at:
          $ref: "#/components/schemas/NullableTimestamp"
          description: "END_STREAM ou RST_STREAM do servidor escrito. Nulo quando o servidor não encerrou o stream: nada foi enviado, ou a resposta começou mas não terminou (o cliente cancelou com RST_STREAM — a espera termina ao ver esse RST_STREAM —, a conexão caiu, ou o fim não apareceu no fio em até 1 s depois do handler). Pode vir nulo com `response_started_at` preenchido."
    HTTP2Info:
      type: object
      description: Spec 010.
      properties:
        mode: { type: string, enum: [alpn, prior-knowledge, upgrade] }
        preface_ok: { type: boolean }
        settings:
          type: array
          description: "`[id, valor]` na ordem recebida."
          items:
            type: array
            prefixItems: [{ type: integer }, { type: integer }]
            minItems: 2
            maxItems: 2
        window_update: { type: [integer, "null"] }
        priorities:
          type: array
          items:
            type: object
            properties:
              stream_id: { type: integer }
              exclusive: { type: boolean }
              depends_on: { type: integer }
              weight: { type: integer }
        priority_frames_capped: { type: boolean }
        akamai:
          type: string
          description: |
            Fingerprint Akamai `S|WU|P|PS` (spec 010 RF-03); `PS` vem do primeiro HEADERS do cliente na conexão.
            Em h2c por `Upgrade: h2c` o stream 1 é a própria requisição HTTP/1 que pediu o upgrade (sem HEADERS),
            então, se o cliente não abrir outro stream, `PS` sai vazio (ex. `3:100;4:65536;2:0|1048510465|0|`).
            `WU` = `00` sem WINDOW_UPDATE inicial; `P` = `0` sem frame PRIORITY antes do primeiro HEADERS.
        streams: { type: array, items: { $ref: "#/components/schemas/HTTP2Stream" } }
        frames: { type: array, items: { $ref: "#/components/schemas/H2Frame" } }
        frames_truncated: { type: boolean, description: "Lista cortada para caber no teto do evento (ADR 0018)." }

    # ------------------------------------------------------------------ HTTP/3 e QUIC
    HTTP3Info:
      type: object
      description: |
        Spec 011. Montado pelo store a partir de `fs.v1.web.http3.connection` (a última versão vale, preservando
        `requests`) e de `fs.v1.web.http3.request` (acrescenta ou substitui por `stream_id`).
      properties:
        version: { type: string, description: "Versão QUIC do primeiro Initial do cliente, em hex (ex. `00000001`)." }
        dcid_hex: { $ref: "#/components/schemas/Hex" }
        scid_hex: { $ref: "#/components/schemas/Hex" }
        token_len: { type: integer }
        token_hex: { $ref: "#/components/schemas/Hex" }
        initial_length: { type: integer, description: Campo Length do primeiro pacote Initial. }
        initial_packet_number: { type: integer }
        initial_datagram_size: { type: integer }
        padded_to_1200: { type: boolean }
        coalesced_packets: { type: integer, description: Pacotes QUIC no primeiro datagrama. }
        client_hello_datagrams:
          type: integer
          description: Datagramas Initial do cliente necessários para remontar o ClientHello (ex. 2 com ML-KEM).
        initial_frames:
          type: array
          description: Tipos de frame dos Initials do cliente até o ClientHello completo, na ordem (ex. `CRYPTO`, `PADDING`, `PING`).
          items: { type: string }
        initial_frames_truncated: { type: boolean, description: "Lista cortada em 256 itens." }
        transport_params:
          type: array
          description: "`[id, nome, valor_hex]` na ordem recebida (GREASE incluído, nome `GREASE`)."
          items:
            type: array
            prefixItems: [{ type: integer }, { type: string }, { type: string }]
            minItems: 3
            maxItems: 3
        client_hello:
          $ref: "#/components/schemas/TLSInfo"
          description: ClientHello decifrado do Initial; `ja4` com prefixo `q`; `negotiated`/`handshake_ms` do handshake QUIC.
        h3_settings:
          type: array
          description: "`[id, valor]` do SETTINGS do cliente, na ordem."
          items:
            type: array
            prefixItems: [{ type: integer }, { type: integer }]
            minItems: 2
            maxItems: 2
        h3_control_stream_seen:
          type: boolean
          description: |
            O cliente abriu o stream de controle h3 (unidirecional tipo 0x00) e o SETTINGS foi lido. `false` com
            `h3_settings: []` = o cliente não abriu (ou não completou) o stream de controle antes do fim; `true` com
            `h3_settings: []` = SETTINGS vazio. Ausente em eventos anteriores ao contrato 0.3.2.
        close:
          type: [object, "null"]
          description: Fim da conexão QUIC visto pelo web; nulo enquanto aberta.
          properties:
            by: { type: string, enum: [client, server, unknown] }
            how: { type: string, enum: [connection_close, application_close, idle_timeout, stateless_reset, handshake_failed] }
            error_code: { type: [integer, "null"] }
            reason: { type: [string, "null"] }
        requests:
          type: array
          items: { $ref: "#/components/schemas/HTTP3Request" }
    HTTP3Request:
      type: object
      description: Uma requisição h3 (spec 011 RF-03).
      properties:
        stream_id: { type: integer }
        pseudo_order: { type: array, items: { type: string } }
        fields: { type: array, items: { $ref: "#/components/schemas/QPACKField" } }
        fields_truncated: { type: boolean, description: "Lista de campos cortada para caber no teto do evento (ADR 0018)." }
        values_truncated: { type: boolean, description: "Algum `value` foi cortado (ADR 0018)." }
        ja4h: { type: [string, "null"], description: "FoxIO License 1.1 (ADR 0010)." }
        body_len: { type: integer, description: Bytes de DATA recebidos no stream. }
        status: { type: integer }
        controls: { $ref: "#/components/schemas/Controls" }
        request_started_at:
          $ref: "#/components/schemas/NullableTimestamp"
          description: "HEADERS do cliente lido no stream. Relógio do web, instante da aplicação (em TLS/QUIC: decifrado, antes de cifrar); ausente antes do 0.4.0 (ADR 0029)."
        request_ended_at:
          $ref: "#/components/schemas/NullableTimestamp"
          description: "FIN do stream do cliente lido; nulo se não veio."
        response_started_at:
          $ref: "#/components/schemas/NullableTimestamp"
          description: "Primeiro HEADERS do servidor escrito; nulo se nenhum HEADERS saiu (ex. reset do stream por erro antes da resposta). Independente dos outros instantes."
        response_ended_at:
          $ref: "#/components/schemas/NullableTimestamp"
          description: "FIN ou RESET_STREAM do stream pelo servidor. Um reset por erro antes do início da resposta conta como fim: vem preenchido com `response_started_at` nulo. Nulo se o servidor não encerrou o stream (nada enviado, ou a resposta começou e a conexão caiu)."
    QPACKField:
      type: object
      properties:
        name: { type: string }
        value: { type: string }
        repr:
          type: string
          enum: [indexed, indexed-post-base, literal-name-ref, literal-post-base-name-ref, literal]
          description: Representação QPACK da linha do campo (RFC 9204 4.5).
        static: { type: [boolean, "null"], description: Referência à tabela estática (true) ou dinâmica (false). }
        index: { type: [integer, "null"] }
        never_indexed: { type: [boolean, "null"], description: Bit N das representações literais. }
        huffman_name: { type: [boolean, "null"] }
        huffman_value: { type: [boolean, "null"] }

    # ------------------------------------------------------------------ WebSocket e raw
    WebSocketInfo:
      type: object
      description: Spec 012.
      properties:
        over: { type: string, enum: [http1.1, h2] }
        path: { type: string }
        extensions: { type: [string, "null"] }
        subprotocol: { type: [string, "null"] }
        frames:
          type: array
          items:
            type: object
            properties:
              dir: { type: string, enum: [in, out] }
              t_ms: { type: number }
              opcode: { type: integer }
              fin: { type: boolean }
              rsv: { type: integer, description: Bits RSV1–3. }
              masked: { type: boolean }
              mask_key_hex: { type: [string, "null"] }
              length: { type: integer }
        frames_truncated: { type: boolean, description: Frames além do teto não são listados (ADR 0018). }
        close:
          type: [object, "null"]
          description: |
            Close de **quem iniciou** o fechamento (spec 012 RF-06): `by`, código e razão do primeiro frame close
            visto. O close de resposta do outro lado aparece só em `frames` (`opcode` 8, `dir`, `length`), sem
            código nem razão. `code`/`reason` nulos quando o frame não tem corpo; `close` nulo quando não houve
            frame close (o TCP caiu antes).
          properties:
            by: { type: string, enum: [client, server] }
            code: { type: [integer, "null"] }
            reason: { type: [string, "null"] }
    RawInfo:
      type: object
      description: Spec 006; também usado pelo web para conexões `raw/unknown` (spec 005, modo sink).
      properties:
        mode: { type: string, enum: [echo, banner, sink, source] }
        tls: { type: boolean }
        banner: { type: [string, "null"] }
        probe_line: { type: [string, "null"] }
        reads_in: { type: array, items: { $ref: "#/components/schemas/TimedLength" } }
        writes_out: { type: array, items: { $ref: "#/components/schemas/TimedLength" } }
        reads_in_truncated: { type: boolean, description: "Só as primeiras 8192 leituras estão em `reads_in` (ADR 0018); os bytes seguem no fluxo `in`." }
        writes_out_truncated: { type: boolean, description: "Só as primeiras 8192 escritas estão em `writes_out` (ADR 0018); os bytes seguem no fluxo `out`." }
        half_close:
          type: [object, "null"]
          properties:
            server_sent_after_client_fin: { type: boolean }
            bytes: { type: integer }

    # ------------------------------------------------------------------ DNS e pacotes
    DNSQuery:
      type: object
      description: Spec 007 RF-06.
      required: [ts, resolver, proto, qname, qtype]
      properties:
        ts: { $ref: "#/components/schemas/Timestamp" }
        probe_id: { type: [string, "null"] }
        resolver: { $ref: "#/components/schemas/Endpoint" }
        proto: { type: string, enum: [udp, tcp] }
        conn_id: { type: [string, "null"], description: "Conexão TCP correlacionada, quando proto=tcp." }
        id: { type: integer }
        opcode: { type: integer }
        flags:
          type: object
          properties:
            rd: { type: boolean }
            cd: { type: boolean }
            ad: { type: boolean }
        qname: { type: string, description: Caixa original (0x20). }
        qtype: { type: string }
        qclass: { type: string }
        edns:
          type: [object, "null"]
          properties:
            version: { type: integer }
            udp_size: { type: integer }
            do: { type: boolean }
            cookie_hex: { type: [string, "null"] }
            ecs:
              type: [object, "null"]
              properties:
                family: { type: integer }
                source_prefix: { type: integer }
                scope_prefix: { type: integer }
                address: { type: string }
            padding_len: { type: [integer, "null"] }
            options:
              type: array
              items:
                type: object
                properties:
                  code: { type: integer }
                  data_hex: { $ref: "#/components/schemas/Hex" }
        response:
          type: object
          properties:
            rcode: { type: string }
            truncated: { type: boolean }
            answers:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  type: { type: string }
                  ttl: { type: integer }
                  data: { type: string }
        rate_limited: { type: boolean }
        raw_b64: { $ref: "#/components/schemas/Base64" }

    StrayPacket:
      type: object
      required: [ts, dir, l4, length]
      properties:
        ts: { $ref: "#/components/schemas/Timestamp" }
        dir: { type: string, enum: [in, out] }
        l4: { type: string, enum: [tcp, udp, icmp, icmpv6, other] }
        family: { type: integer, enum: [4, 6] }
        src: { $ref: "#/components/schemas/Endpoint" }
        dst: { $ref: "#/components/schemas/Endpoint" }
        tcp_flags: { type: [string, "null"] }
        length: { type: integer }
        summary: { type: string }
        frame_b64: { $ref: "#/components/schemas/Base64" }

    # ------------------------------------------------------------------ tempo real
    LiveEvent:
      type: object
      required: [kind, ts]
      description: |
        Evento do `/stream` e do `/ws`. `data` depende de `kind`: ConnectionSummary (connection.*),
        HTTP1Request, HTTP2Stream ou HTTP3Request (http.request), DNSQuery (dns.query),
        StrayPacket (packet.stray), LiveDropped (stream.dropped, só para o cliente que perdeu eventos).
      properties:
        kind:
          type: string
          enum: [connection.opened, connection.updated, connection.closed, http.request, dns.query, packet.stray, stream.dropped]
        ts:
          $ref: "#/components/schemas/Timestamp"
          description: |
            Instante em que o espelho teve o fato e pôde emiti-lo (ADR 0025), base do atraso do feed (RNF-02):
            `connection.opened` = primeiro pacote ou evento; `connection.updated` = publicação do evento de
            aplicação que o produziu (entrada no stream do NATS), não o início da sessão; `connection.closed` =
            fim por FIN/RST/QUIC ou, por ociosidade, o instante em que o espelho decidiu fechar;
            `http.request`, `dns.query` = o fato; `packet.stray` = o pacote quando emitido na chegada (RST
            avulso, ICMP) ou, para o avulso decidido pelo fim do fluxo por ociosidade (UDP ou SYN sem resposta),
            o instante da decisão (ADR 0026); `stream.dropped` = o envio. Os tempos da conexão estão em
            `data.started` e `data.ended`; os do pacote, no `data` do `packet.stray`.
        conn_id: { type: [string, "null"] }
        probe_id: { type: [string, "null"] }
        data:
          anyOf:
            - $ref: "#/components/schemas/ConnectionSummary"
            - $ref: "#/components/schemas/HTTP1Request"
            - $ref: "#/components/schemas/HTTP2Stream"
            - $ref: "#/components/schemas/HTTP3Request"
            - $ref: "#/components/schemas/DNSQuery"
            - $ref: "#/components/schemas/StrayPacket"
            - $ref: "#/components/schemas/LiveDropped"
    LiveDropped:
      type: object
      required: [dropped]
      description: Eventos descartados para este cliente desde o último `stream.dropped` (fila cheia, ADR 0020).
      properties:
        dropped: { type: integer, minimum: 1 }
