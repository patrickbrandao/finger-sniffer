# CI: verify-full em todo PR e na main (spec 017 RF-11, ADR 0013).
# Sem --e2e e sem testes linux_priv (precisam do finger-01, ADR 0038).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Em PR, um push novo cancela a execução anterior do mesmo PR. Na main, cada commit tem grupo próprio (SHA) e
# nunca é cancelado: todo merge recebe o seu verify-full (task 219). Um grupo único por ref, mesmo sem
# cancel-in-progress, ainda descartaria execuções pendentes no meio de uma fila de merges.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Testes do store com -race em lotes paralelos (task 294, ADR 0059): saem do passo de testes do verify-full e
# rodam nos jobs store-race; o race-check confere que a união dos lotes é a lista inteira de testes e soma a
# cobertura. O verify-full local (sem estas variáveis) continua rodando tudo de uma vez.
env:
  FS_RACE_SPLIT_PKGS: ./internal/store/...
  FS_RACE_OUT: tmp/race

jobs:
  # Tempo (task 253): ~13 min depois do fuzz em lotes paralelos (eram 17–20 min, colado no limite antigo de 20).
  # O passo tem 25 min pelo `timeout`, que imprime o resumo e marca o erro como tempo esgotado; o job tem 30 min
  # só como rede de segurança (setup + ferramentas ~1,5 min).
  verify-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Ferramentas
        run: make tools-ci

      # Tempo esgotado sai como erro próprio ("tempo esgotado"), distinto de falha de teste: o verify.sh recebe
      # TERM, imprime o resumo com o passo interrompido e o passo anota o motivo.
      - name: verify-full
        env:
          FS_SKIP_LINUX_PRIV: "1"
          # testes sem -race no job norace (task 360)
          FS_SKIP_NORACE: "1"
        run: |
          rc=0
          timeout --kill-after=30s 25m make verify-full || rc=$?
          if [ "$rc" = 124 ] || [ "$rc" = 137 ]; then
            echo "::error title=verify-full: tempo esgotado::passou de 25 min; não é falha de teste (veja o resumo do verify.sh)"
            echo "### verify-full: tempo esgotado (25 min)" >>"$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      # perfil de cobertura sem o store, somado aos lotes no race-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: race-main
          path: tmp/race/
          if-no-files-found: error
          retention-days: 3

  # Lotes do store com -race (task 294). Lotes e pesos: race_assign em scripts/verify.sh e
  # scripts/race-weights.txt; o número de lotes é o tamanho da matriz (o race-check recebe o mesmo número).
  store-race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Cache próprio (chave com o race-weights.txt): o da chave só do go.sum é salvo pelo primeiro job a
          # terminar (release-build, sem -race) e não traz as dependências compiladas com -race.
          cache-dependency-path: |
            go.sum
            scripts/race-weights.txt

      - name: store -race (lote ${{ matrix.shard }}/${{ strategy.job-total }})
        run: timeout --kill-after=30s 10m scripts/verify.sh race-shard "${{ matrix.shard }}" "${{ strategy.job-total }}" "$FS_RACE_OUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: race-shard-${{ matrix.shard }}
          path: tmp/race/
          if-no-files-found: error
          retention-days: 3

  # Testes de tempo sem -race (spec 017 RF-08c, task 360): se pulam ou afrouxam com -race, então rodam aqui, por
  # nome (lista em scripts/verify.sh), com o p0f.fp real (RF-08b) e um tmpfs pequeno de verdade para o
  # TestDBFullRealTmpfs (ADR 0045).
  norace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # 32 MiB, não os 16 MiB da RF-08c: em 16 MiB o TestDBFullRealTmpfs reprova de forma determinística (só passa
      # de 24 a 40 MiB); volta a 16 MiB com a task 416.
      - name: tmpfs de 32 MiB
        run: |
          sudo mkdir -p /mnt/fs-tmpfs
          sudo mount -t tmpfs -o size=32m,mode=1777 tmpfs /mnt/fs-tmpfs
          df -h /mnt/fs-tmpfs

      - name: testes sem -race
        env:
          FS_TEST_TMPFS: /mnt/fs-tmpfs
        run: timeout --kill-after=30s 10m scripts/verify.sh norace

  # Nenhum teste fora dos lotes (nem repetido) e cobertura total = verify-full + lotes; depende também do norace
  # para a proteção da branch seguir com um check só.
  race-check:
    needs: [verify-full, store-race, norace]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: race-*
          path: tmp/race
          merge-multiple: true

      - name: race-check
        run: scripts/verify.sh race-check 4 "$FS_RACE_OUT"

  # Build reproduzível e pacote de release (task 070). Os hashes com VERSION/COMMIT fixos saem no log
  # para comparar com um build feito no Mac (mesma toolchain do go.mod).
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Binários versionados
        run: scripts/check-binaries.sh

      - name: Build reproduzível
        run: make repro-check

      - name: Build reproduzível (versão fixa, para comparar entre máquinas)
        env:
          VERSION: v0.0.0-test
          COMMIT: "0000000"
        run: make repro-check

      - name: make release (teste)
        run: scripts/release-test.sh
