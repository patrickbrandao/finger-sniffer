# CI: verify-full em todo PR e na main (spec 017 RF-11, ADR 0013).
# Sem --e2e e sem testes linux_priv (precisam da vps602).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Ferramentas
        run: make tools-ci

      - name: verify-full
        env:
          FS_SKIP_LINUX_PRIV: "1"
        run: make verify-full
