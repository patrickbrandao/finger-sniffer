# CI: verify-full em todo PR e na main (spec 017 RF-11, ADR 0013).
# Sem --e2e e sem testes linux_priv (precisam do finger-01, ADR 0038).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Em PR, um push novo cancela a execução anterior do mesmo PR. Na main, cada commit tem grupo próprio (SHA) e
# nunca é cancelado: todo merge recebe o seu verify-full (task 219). Um grupo único por ref, mesmo sem
# cancel-in-progress, ainda descartaria execuções pendentes no meio de uma fila de merges.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Ferramentas
        run: make tools-ci

      - name: verify-full
        env:
          FS_SKIP_LINUX_PRIV: "1"
        run: make verify-full

  # Build reproduzível e pacote de release (task 070). Os hashes com VERSION/COMMIT fixos saem no log
  # para comparar com um build feito no Mac (mesma toolchain do go.mod).
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Binários versionados
        run: scripts/check-binaries.sh

      - name: Build reproduzível
        run: make repro-check

      - name: Build reproduzível (versão fixa, para comparar entre máquinas)
        env:
          VERSION: v0.0.0-test
          COMMIT: "0000000"
        run: make repro-check

      - name: make release (teste)
        run: scripts/release-test.sh
