# NATS local do finger-sniffer (ADR 0003). Só loopback; nunca exposto. Sem a monitoração HTTP (8222): ela mostraria
# conexões e o JetStream a qualquer processo do host sem autenticação (ADR 0075 item 1.5).
server_name: finger-sniffer
listen: 127.0.0.1:4222

max_payload: 1MB

jetstream {
  store_dir: /finger-sniffer/var/nats
  # folga sobre o stream FS_EVENTS de 128 MiB (ADR 0039 item 3)
  max_memory_store: 256MB
  max_file_store: 256MB
}

# Senhas dos usuários (ADR 0075 item 1.2): o deploy gera /finger-sniffer/etc/nats/auth.conf a partir de
# etc/nats/<usuário>.password, só com as variáveis FS_NATS_PW_<USUÁRIO>. Caminho relativo a este arquivo
# (/finger-sniffer/eventbus/nats/). Tem de vir antes do bloco authorization, que usa as variáveis.
include "../../etc/nats/auth.conf"

# Um usuário por serviço com permissões mínimas em lista de permissão (ADR 0075 item 1.1): o que não está listado
# é negado. Sem no_auth_user: conexão sem credencial é recusada. _INBOX.> só para quem pede (request/reply como
# requerente ou API do JetStream); allow_responses para quem responde (libera uma resposta ao inbox do pedido sem
# abrir _INBOX.> para publicação). Quem não assina nada leva subscribe deny ">": sem o bloco, assinar seria livre.
authorization {
  users = [
    # lotes FSPB de pacotes (internal/capture/batch.go)
    {
      user: capture
      password: $FS_NATS_PW_CAPTURE
      permissions: {
        publish: { allow: ["fs.v1.capture.packet", "fs.v1.svc.heartbeat"] }
        subscribe: { deny: [">"] }
      }
    }
    # eventos web, DNS-01 (internal/web/acmedns.go) e conn_id (service.RequestConnID) como requerente
    {
      user: web
      password: $FS_NATS_PW_WEB
      permissions: {
        publish: { allow: ["fs.v1.web.>", "fs.v1.svc.heartbeat", "fs.v1.dns.acme.set", "fs.v1.dns.acme.clear", "fs.v1.store.conn_id"] }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
    # sessões e leituras; o TLS opcional do raw publica nos subjects de TLS do web (internal/raw/tls.go)
    {
      user: raw
      password: $FS_NATS_PW_RAW
      permissions: {
        publish: { allow: ["fs.v1.raw.>", "fs.v1.web.tls.client_hello", "fs.v1.web.tls.handshake", "fs.v1.svc.heartbeat"] }
        subscribe: { deny: [">"] }
      }
    }
    # consultas e resposta ao DNS-01 (internal/dns/acme.go)
    {
      user: dns
      password: $FS_NATS_PW_DNS
      permissions: {
        publish: { allow: ["fs.v1.dns.query", "fs.v1.svc.heartbeat"] }
        subscribe: { allow: ["fs.v1.dns.acme.set", "fs.v1.dns.acme.clear"] }
        allow_responses: true
      }
    }
    # dono do stream FS_EVENTS e do consumidor "store" (cria, recria, Fetch, Ack/Nak; respostas da API e do Fetch
    # chegam no inbox), publica fs.v1.store.connection e responde ao conn_id
    {
      user: store
      password: $FS_NATS_PW_STORE
      permissions: {
        publish: { allow: ["fs.v1.store.connection", "fs.v1.svc.heartbeat", "$JS.API.>", "$JS.ACK.FS_EVENTS.>"] }
        subscribe: { allow: ["fs.v1.svc.heartbeat", "fs.v1.store.conn_id", "_INBOX.>"] }
        allow_responses: true
      }
    }
    # conexões do store e heartbeats (spec 018 RF-02)
    {
      user: bot
      password: $FS_NATS_PW_BOT
      permissions: {
        publish: { allow: ["fs.v1.svc.heartbeat"] }
        subscribe: { allow: ["fs.v1.store.connection", "fs.v1.svc.heartbeat"] }
      }
    }
  ]
}

# Streams são criados pelo store no start (ver asyncapi.yaml e specs/001-arquitetura.md):
#   FS_EVENTS: lista explícita de subjects de eventos (ADR 0017; pkg/event.StreamSubjects):
#     fs.v1.capture.> , fs.v1.web.> , fs.v1.raw.> , fs.v1.dns.query , fs.v1.svc.>
#   MemoryStorage, max_age 60s, max_bytes 128MiB (ADR 0039), consumidor durável "store".
#   Nunca fs.v1.> : os request/reply (fs.v1.dns.acme.*, fs.v1.store.conn_id) são NATS core e ficam fora do
#   stream, senão o JetStream responderia um PubAck no inbox da requisição.
#   (ADR 0016: o file store travava o disco; ADR 0039: max_memory_store de 256MB dá folga sobre os 128MiB)
