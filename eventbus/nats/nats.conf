# NATS local do finger-sniffer (ADR 0003). Só loopback; nunca exposto.
server_name: finger-sniffer
listen: 127.0.0.1:4222
http: 127.0.0.1:8222

max_payload: 1MB

jetstream {
  store_dir: /finger-sniffer/var/nats
  max_memory_store: 64MB
  max_file_store: 256MB
}

# Streams são criados pelo store no start (ver asyncapi.yaml e specs/001-arquitetura.md):
#   FS_EVENTS: subjects fs.v1.> , max_age 60s, max_bytes 64MiB, consumidor durável "store"
