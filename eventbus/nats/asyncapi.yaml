asyncapi: 3.1.0
info:
  title: finger-sniffer events
  version: 0.2.1
  description: |
    Eventos internos no NATS local (ADR 0003). Subjects `fs.v1.<origem>.<tipo>`. O stream JetStream `FS_EVENTS`
    (em memória, max_age 60 s, max_bytes 32 MiB — ADR 0016) assina a lista explícita de subjects de eventos
    `fs.v1.capture.>`, `fs.v1.web.>`, `fs.v1.raw.>`, `fs.v1.dns.query`, `fs.v1.svc.>` (ADR 0017). Os request/reply
    `fs.v1.dns.acme.*` e `fs.v1.store.conn_id` são NATS core e ficam fora do stream (senão o JetStream responderia
    um PubAck no inbox da requisição). Um subject de evento novo entra nessa lista no mesmo PR.

    Tamanho (ADR 0018): nenhum evento JSON passa de 900 KiB; campos inline de bytes crus levam no máximo
    `FS_EVENT_INLINE_MAX` (128 KiB) cada, marcados `*_truncated` quando cortados; os bytes completos de cada sentido
    vão por `fs.v1.web.stream.bytes` / `fs.v1.raw.read` em pedaços de até 64 KiB, até `FS_RAW_STREAM_MAX_BYTES`
    (16 MiB) por sentido e conexão.

    Dois formatos:
    - **Eventos de aplicação** (JSON, `application/json`): `Envelope` com `payload` tipado. Os payloads
      usam os mesmos esquemas da API (`cmd/finger-sniffer-store/openapi.yaml`).
    - **Lote de pacotes** (`fs.v1.capture.packet`, binário, ADR 0015): envelope nos cabeçalhos NATS e
      corpo no formato FSPB v1.

    Compatibilidade (ADR 0001): `fs.v1.*` só recebe mudanças aditivas; campos desconhecidos são ignorados.

    Exemplos (spec 017 RF-12): cada mensagem JSON referencia em `examples` (ou num trait `*Examples`) os eventos
    golden gerados pelo código real dos produtores (`internal/<svc>/testdata/`), regravados pelos próprios testes
    com `-update`. O AsyncAPI CLI só confere exemplos de documentos 2.x; a validação dos exemplos contra os payloads
    é um passo próprio do verify.
    Exemplo escrito à mão é marcado `(à mão)` no `summary` e trocado pelo golden quando o produtor o gerar.
  license:
    name: Apache-2.0
defaultContentType: application/json

servers:
  local:
    host: 127.0.0.1:4222
    protocol: nats
    description: Somente loopback.

channels:
  capturePacket:
    address: fs.v1.capture.packet
    messages:
      packetBatch: { $ref: "#/components/messages/PacketBatch" }
  webTLSClientHello:
    address: fs.v1.web.tls.client_hello
    messages:
      tlsClientHello: { $ref: "#/components/messages/TLSClientHello" }
  webTLSHandshake:
    address: fs.v1.web.tls.handshake
    messages:
      tlsHandshake: { $ref: "#/components/messages/TLSHandshake" }
  webHTTP1Request:
    address: fs.v1.web.http1.request
    messages:
      http1Request: { $ref: "#/components/messages/HTTP1Request" }
  webHTTP2Connection:
    address: fs.v1.web.http2.connection
    messages:
      http2Connection: { $ref: "#/components/messages/HTTP2Connection" }
  webHTTP2Stream:
    address: fs.v1.web.http2.stream
    messages:
      http2Stream: { $ref: "#/components/messages/HTTP2Stream" }
  webHTTP3Connection:
    address: fs.v1.web.http3.connection
    messages:
      http3Connection: { $ref: "#/components/messages/HTTP3Connection" }
  webWebSocketFrame:
    address: fs.v1.web.websocket.frame
    messages:
      websocketFrame: { $ref: "#/components/messages/WebSocketFrame" }
  webStreamBytes:
    address: fs.v1.web.stream.bytes
    messages:
      streamBytes: { $ref: "#/components/messages/StreamBytes" }
  webRawSession:
    address: fs.v1.web.raw.session
    description: Conexão de porta web sem protocolo reconhecido (`raw/unknown`, modo sink — spec 005).
    messages:
      rawSession: { $ref: "#/components/messages/RawSession" }
  rawSession:
    address: fs.v1.raw.session
    messages:
      rawSession: { $ref: "#/components/messages/RawSession" }
  rawRead:
    address: fs.v1.raw.read
    messages:
      streamBytes: { $ref: "#/components/messages/StreamBytes" }
  dnsQuery:
    address: fs.v1.dns.query
    messages:
      dnsQuery: { $ref: "#/components/messages/DNSQuery" }
  dnsACMESet:
    address: fs.v1.dns.acme.set
    messages:
      acmeRequest: { $ref: "#/components/messages/ACMERequest" }
  dnsACMEClear:
    address: fs.v1.dns.acme.clear
    messages:
      acmeRequest: { $ref: "#/components/messages/ACMERequest" }
  dnsACMEReply:
    address: null
    description: Inbox de resposta do request/reply (NATS core).
    messages:
      acmeReply: { $ref: "#/components/messages/ACMEReply" }
  storeConnID:
    address: fs.v1.store.conn_id
    description: Request/reply NATS core (ADR 0017), fora do stream.
    messages:
      connIDRequest: { $ref: "#/components/messages/ConnIDRequest" }
  storeConnIDReply:
    address: null
    description: Inbox de resposta do `fs.v1.store.conn_id`.
    messages:
      connIDReply: { $ref: "#/components/messages/ConnIDReply" }
  svcHeartbeat:
    address: fs.v1.svc.heartbeat
    messages:
      heartbeat: { $ref: "#/components/messages/Heartbeat" }

operations:
  publishPackets:
    action: send
    channel: { $ref: "#/channels/capturePacket" }
    summary: capture publica lotes de pacotes.
  consumePackets:
    action: receive
    channel: { $ref: "#/channels/capturePacket" }
    summary: store consome (consumidor durável `store`).
  publishTLSClientHello:
    action: send
    channel: { $ref: "#/channels/webTLSClientHello" }
    summary: web e raw publicam o ClientHello analisado.
  publishTLSHandshake:
    action: send
    channel: { $ref: "#/channels/webTLSHandshake" }
  publishHTTP1Request:
    action: send
    channel: { $ref: "#/channels/webHTTP1Request" }
  publishHTTP2Connection:
    action: send
    channel: { $ref: "#/channels/webHTTP2Connection" }
  publishHTTP2Stream:
    action: send
    channel: { $ref: "#/channels/webHTTP2Stream" }
  publishHTTP3Connection:
    action: send
    channel: { $ref: "#/channels/webHTTP3Connection" }
  publishWebSocketFrame:
    action: send
    channel: { $ref: "#/channels/webWebSocketFrame" }
  publishStreamBytes:
    action: send
    channel: { $ref: "#/channels/webStreamBytes" }
  publishRawSession:
    action: send
    channel: { $ref: "#/channels/rawSession" }
  publishWebRawSession:
    action: send
    channel: { $ref: "#/channels/webRawSession" }
    summary: web publica no fim de uma conexão tratada como TCP cru.
  publishRawRead:
    action: send
    channel: { $ref: "#/channels/rawRead" }
  publishDNSQuery:
    action: send
    channel: { $ref: "#/channels/dnsQuery" }
  requestACMESet:
    action: send
    channel: { $ref: "#/channels/dnsACMESet" }
    summary: web pede ao dns para publicar o TXT do DNS-01.
    reply:
      channel: { $ref: "#/channels/dnsACMEReply" }
  requestACMEClear:
    action: send
    channel: { $ref: "#/channels/dnsACMEClear" }
    reply:
      channel: { $ref: "#/channels/dnsACMEReply" }
  requestConnID:
    action: send
    channel: { $ref: "#/channels/storeConnID" }
    summary: web pede ao store o conn_id da 5-tupla (o store responde ou reserva um ULID por 30 s).
    reply:
      channel: { $ref: "#/channels/storeConnIDReply" }
  publishHeartbeat:
    action: send
    channel: { $ref: "#/channels/svcHeartbeat" }
    summary: Todos os serviços, a cada 5 s.

components:
  schemas:
    Flow:
      type: object
      description: 5-tupla do ponto de vista do cliente (src = cliente, dst = espelho).
      required: [l4, src_ip, src_port, dst_ip, dst_port]
      properties:
        l4: { type: string, enum: [tcp, udp] }
        src_ip: { type: string }
        src_port: { type: integer }
        dst_ip: { type: string }
        dst_port: { type: integer }
        quic_dcid_hex: { type: string, description: DCID do Initial (QUIC). }
    Envelope:
      type: object
      required: [schema_version, service, service_version, ts]
      properties:
        schema_version: { type: integer, const: 1 }
        service: { type: string, enum: [capture, web, raw, dns, store] }
        service_version: { type: string }
        ts: { type: string, description: "RFC 3339 UTC com nanossegundos: quando o fato ocorreu." }
        flow: { $ref: "#/components/schemas/Flow" }
        probe_id: { type: [string, "null"], description: Probe já extraído pelo produtor, quando houver. }
    StreamBytesPayload:
      type: object
      description: Pedaço de até 64 KiB de um sentido (ADR 0018).
      required: [dir, offset, data_b64]
      properties:
        dir: { type: string, enum: [in, out] }
        offset: { type: integer, description: Posição no fluxo de aplicação do sentido. }
        data_b64: { type: string, contentEncoding: base64 }
        truncated:
          type: boolean
          description: |
            true no último pedaço (vazio) quando o sentido passou de FS_RAW_STREAM_MAX_BYTES; nada mais é
            publicado nesse sentido.
    ConnIDRequestPayload:
      type: object
      required: [flow, ts]
      properties:
        flow: { $ref: "#/components/schemas/Flow" }
        ts: { type: string, description: "Instante do accept (RFC 3339 UTC com nanossegundos)." }
    ConnIDReplyPayload:
      type: object
      required: [conn_id]
      properties:
        conn_id: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
        reserved: { type: boolean, description: "true se o ID foi reservado (a conexão ainda não existia no store)." }
    WebSocketFramePayload:
      type: object
      properties:
        dir: { type: string, enum: [in, out] }
        opcode: { type: integer }
        fin: { type: boolean }
        rsv: { type: integer }
        masked: { type: boolean }
        mask_key_hex: { type: [string, "null"] }
        length: { type: integer }
        upgrade:
          type: [object, "null"]
          description: Presente no primeiro frame; dados do Upgrade e extensões negociadas.
          properties:
            over: { type: string, enum: [http1.1, h2] }
            path: { type: string }
            extensions: { type: [string, "null"] }
            subprotocol: { type: [string, "null"] }
        close:
          type: [object, "null"]
          properties:
            by: { type: string, enum: [client, server] }
            code: { type: [integer, "null"] }
            reason: { type: [string, "null"] }
    TLSHandshakePayload:
      type: object
      description: Resultado do handshake; o store funde no `tls` do registro (spec 004).
      properties:
        negotiated:
          type: [object, "null"]
          properties:
            version: { type: string }
            cipher: { type: string }
            group: { type: string }
            alpn: { type: [string, "null"] }
            resumed: { type: boolean }
        handshake_ms: { type: [number, "null"] }
        alerts:
          type: array
          items:
            type: object
            properties:
              dir: { type: string, enum: [in, out] }
              level: { type: integer }
              description: { type: integer }
    HeartbeatPayload:
      type: object
      required: [status, commit, started_at]
      properties:
        status: { type: string, enum: [ok, degraded] }
        reasons: { type: array, items: { type: string } }
        commit: { type: string }
        started_at: { type: string }
        metrics:
          type: object
          description: Contadores e medidas para o /metrics agregado (ex. dropped_events_total).
          additionalProperties: { type: number }

  messageTraits:
    JSONEvent:
      contentType: application/json
    # Exemplos das mensagens ACME ficam em traits: os testes de contrato de pkg/event e internal/dns leem o bloco
    # dessas mensagens como texto e tomariam as chaves dos exemplos por propriedades.
    ACMERequestExamples:
      examples:
        - name: set_dns01
          summary: (à mão) pedido do provedor libdns do web.
          payload:
            name: _acme-challenge.dns-monitor.tmsoft.com.br.
            value: Qm9n9W2qkfQx1h4rM5fJb2u8yYxT0yQ8c0xYk7oHk1E
    ACMEReplyExamples:
      examples:
        - name: ok
          summary: (à mão)
          payload:
            ok: true
            error: null
        - name: out_of_zone
          summary: (à mão) nome fora da zona.
          payload:
            ok: false
            error: "name is not _acme-challenge.<name> inside the zone"

  messages:
    PacketBatch:
      name: PacketBatch
      title: Lote de pacotes (FSPB v1)
      contentType: application/octet-stream
      summary: Até 5 ms ou 256 pacotes por mensagem (spec 003 RF-04).
      description: |
        Corpo binário FSPB v1 (ADR 0015), little-endian, sequência de registros:

        | Campo | Tipo | Descrição |
        | --- | --- | --- |
        | ts_ns | u64 | timestamp do kernel, ns desde a época Unix (UTC) |
        | dir | u8 | 0 = in (para o espelho), 1 = out (do espelho) |
        | flags | u8 | bit0 = offload_suspect (frame > MTU + 14), bit1 = truncado pelo snaplen |
        | reserved | u16 | zero |
        | wire_len | u32 | tamanho no fio |
        | cap_len | u32 | bytes capturados que seguem |
        | frame | cap_len bytes | frame Ethernet completo (L2) |

        Cabeçalho do registro: 20 bytes. A mensagem não tem cabeçalho de arquivo; o número de registros
        vai no cabeçalho NATS `Fs-Count`.
      headers:
        type: object
        required: [Fs-Schema-Version, Fs-Service, Fs-Service-Version, Fs-Format, Fs-Count]
        properties:
          Fs-Schema-Version: { type: string, const: "1" }
          Fs-Service: { type: string, const: capture }
          Fs-Service-Version: { type: string }
          Fs-Format: { type: string, const: fspb1 }
          Fs-Count: { type: string, description: Número de registros (decimal). }
          Fs-Iface: { type: string }
      payload:
        type: string
        format: binary

    TLSClientHello:
      name: TLSClientHello
      examples:
        - name: web
          payload:
            $ref: "../../internal/web/testdata/events/tls.client_hello.json"
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      summary: ClientHello cru e analisado (spec 008), de web ou raw.
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: object
            properties:
              payload: { $ref: "../../cmd/finger-sniffer-store/openapi.yaml#/components/schemas/TLSInfo" }
    TLSHandshake:
      name: TLSHandshake
      examples:
        - name: web
          payload:
            $ref: "../../internal/web/testdata/events/tls.handshake.json"
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: object
            properties:
              payload: { $ref: "#/components/schemas/TLSHandshakePayload" }
    HTTP1Request:
      name: HTTP1Request
      examples:
        - name: web_chunked_100_continue
          payload:
            $ref: "../../internal/web/testdata/events/http1.request.json"
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      summary: Uma requisição HTTP/1.x e a resposta enviada (spec 009).
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: object
            properties:
              payload: { $ref: "../../cmd/finger-sniffer-store/openapi.yaml#/components/schemas/HTTP1Request" }
    HTTP2Connection:
      name: HTTP2Connection
      examples:
        - name: web
          payload:
            $ref: "../../internal/web/testdata/events/http2.connection.json"
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      summary: Nível de conexão h2 (prefácio, SETTINGS, PRIORITY, Akamai, frames); `streams` vazio.
      description: |
        Pode ser publicado mais de uma vez na mesma conexão (ex. depois do prefácio e no fim, com os frames);
        o store fica com a última versão.
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: object
            properties:
              payload: { $ref: "../../cmd/finger-sniffer-store/openapi.yaml#/components/schemas/HTTP2Info" }
    HTTP2Stream:
      name: HTTP2Stream
      examples:
        - name: web
          payload:
            $ref: "../../internal/web/testdata/events/http2.stream.json"
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: object
            properties:
              payload: { $ref: "../../cmd/finger-sniffer-store/openapi.yaml#/components/schemas/HTTP2Stream" }
    HTTP3Connection:
      name: HTTP3Connection
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      summary: Initial QUIC analisado e requisições h3 (spec 011).
      description: Sem exemplo até o produtor h3 existir (F4); a tarefa do h3 acrescenta o golden.
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: object
            properties:
              payload: { $ref: "../../cmd/finger-sniffer-store/openapi.yaml#/components/schemas/HTTP3Info" }
    WebSocketFrame:
      name: WebSocketFrame
      examples:
        - name: web_first_frame
          payload:
            $ref: "../../internal/web/testdata/events/websocket.frame.json"
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: object
            properties:
              payload: { $ref: "#/components/schemas/WebSocketFramePayload" }
    StreamBytes:
      name: StreamBytes
      examples:
        - name: web_in
          payload:
            $ref: "../../internal/web/testdata/events/stream.bytes.json"
        - name: raw_in
          payload:
            $ref: "../../internal/raw/testdata/raw_read.golden.json"
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      summary: Bytes de aplicação de um sentido (para /raw?dir=), em pedaços com offset.
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: object
            properties:
              payload: { $ref: "#/components/schemas/StreamBytesPayload" }
    RawSession:
      name: RawSession
      examples:
        - name: web_sink
          payload:
            $ref: "../../internal/web/testdata/events/raw.session.json"
        - name: raw_probe_source
          payload:
            $ref: "../../internal/raw/testdata/raw_session_probe.golden.json"
        - name: raw_half_close
          payload:
            $ref: "../../internal/raw/testdata/raw_session_halfclose.golden.json"
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      summary: Sessão TCP crua (spec 006), publicada no fim da sessão.
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: object
            properties:
              payload: { $ref: "../../cmd/finger-sniffer-store/openapi.yaml#/components/schemas/RawInfo" }
    DNSQuery:
      name: DNSQuery
      examples:
        - name: udp_a_ecs
          payload:
            $ref: "../../internal/dns/testdata/events/udp-a-ecs.json"
        - name: tcp_https_v4
          payload:
            $ref: "../../internal/dns/testdata/events/tcp-https-v4.json"
        - name: udp_formerr
          payload:
            $ref: "../../internal/dns/testdata/events/udp-formerr.json"
        - name: udp_rate_limited
          payload:
            $ref: "../../internal/dns/testdata/events/udp-rate-limited.json"
        - name: udp_refused
          payload:
            $ref: "../../internal/dns/testdata/events/udp-refused.json"
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      summary: Consulta e resposta DNS (spec 007 RF-06).
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: object
            properties:
              payload: { $ref: "../../cmd/finger-sniffer-store/openapi.yaml#/components/schemas/DNSQuery" }
    ACMERequest:
      name: ACMERequest
      traits:
        - $ref: "#/components/messageTraits/JSONEvent"
        - $ref: "#/components/messageTraits/ACMERequestExamples"
      description: |
        Cada nome guarda um conjunto de valores (spec 007): `set` acrescenta o valor (idempotente), `clear` remove só
        aquele valor; cada valor expira 10 min após o `set`. Nome fora da zona → `ok: false`.
      payload:
        type: object
        required: [name, value]
        properties:
          name: { type: string, description: "Nome completo, ex. _acme-challenge.dns-monitor.tmsoft.com.br." }
          value: { type: string }
    ACMEReply:
      name: ACMEReply
      traits:
        - $ref: "#/components/messageTraits/JSONEvent"
        - $ref: "#/components/messageTraits/ACMEReplyExamples"
      payload:
        type: object
        required: [ok]
        properties:
          ok: { type: boolean }
          error: { type: [string, "null"] }
    ConnIDRequest:
      name: ConnIDRequest
      examples:
        - name: accept
          summary: pedido do produtor no accept (service.RequestConnID).
          payload:
            $ref: "../../pkg/service/testdata/events/store.conn_id.request.json"
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      payload: { $ref: "#/components/schemas/ConnIDRequestPayload" }
    ConnIDReply:
      name: ConnIDReply
      examples:
        - name: reserved
          summary: a conexão ainda não existia no store.
          payload:
            $ref: "../../internal/store/testdata/events/store.conn_id.reply.json"
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      payload: { $ref: "#/components/schemas/ConnIDReplyPayload" }
    Heartbeat:
      name: Heartbeat
      examples:
        - name: web_degraded
          payload:
            $ref: "../../pkg/service/testdata/events/svc.heartbeat.json"
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      summary: A cada 5 s; o store marca `down` após 15 s sem heartbeat.
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: object
            properties:
              payload: { $ref: "#/components/schemas/HeartbeatPayload" }
