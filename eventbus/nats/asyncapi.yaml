asyncapi: 3.1.0
info:
  title: finger-sniffer events
  version: 0.7.0
  description: |
    Eventos internos no NATS local (ADR 0003). Subjects `fs.v1.<origem>.<tipo>`. O stream JetStream `FS_EVENTS`
    (em memória, max_age 60 s, max_bytes 128 MiB — ADRs 0016 e 0039) assina a lista explícita de subjects de eventos
    `fs.v1.capture.>`, `fs.v1.web.>`, `fs.v1.raw.>`, `fs.v1.dns.query`, `fs.v1.svc.>` (ADR 0017). Os request/reply
    `fs.v1.dns.acme.*` e `fs.v1.store.conn_id` são NATS core e ficam fora do stream (senão o JetStream responderia
    um PubAck no inbox da requisição). `fs.v1.store.connection` (estado da conexão depois do commit, para o serviço
    bot, ADR 0047) também é NATS core, fora do stream: sem assinante, a mensagem se perde. Um subject de evento novo entra nessa lista no mesmo PR.

    Tamanho (ADR 0018): nenhum evento JSON passa de 900 KiB; campos inline de bytes crus levam no máximo
    `FS_EVENT_INLINE_MAX` (128 KiB) cada, marcados `*_truncated` quando cortados; os bytes completos de cada sentido
    vão por `fs.v1.web.stream.bytes` / `fs.v1.raw.read` em pedaços de até 64 KiB, até `FS_RAW_STREAM_MAX_BYTES`
    (16 MiB) por sentido e conexão.

    Dois formatos:
    - **Eventos de aplicação** (JSON, `application/json`): `Envelope` com `payload` tipado. Os payloads
      usam os mesmos esquemas da API (`cmd/finger-sniffer-store/openapi.yaml`).
    - **Lote de pacotes** (`fs.v1.capture.packet`, binário, ADR 0015): envelope nos cabeçalhos NATS e
      corpo no formato FSPB v1.

    Compatibilidade (ADR 0001): `fs.v1.*` só recebe mudanças aditivas; campos desconhecidos são ignorados.

    Versão: acompanha a do openapi sempre que um payload referenciado de lá muda (0.3.2 trouxe
    `h3_control_stream_seen` no `HTTP3Info` de `fs.v1.web.http3.connection`; as duas voltam juntas em 0.3.3; 0.3.4 é documental nas duas: `ts` dos resumos de sessão aqui e
    `LiveEvent.ts` lá, ADR 0025; 0.4.0, aditivo nas duas: `request_started_at`, `request_ended_at`,
    `response_started_at` e `response_ended_at` nos payloads de `http1.request`, `http2.stream` e
    `http3.request`, e a origem dos `alerts` do `tls.handshake` descrita, ADR 0029; 0.4.1, documental nas duas:
    quando cada instante é nulo, descrito nos esquemas do openapi; o openapi 0.5.0 não mexeu em payload daqui;
    0.5.0, aditivo, com o openapi 0.6.0, ADR 0032: `upgrade_only` no `WebSocketFramePayload`,
    `request_line.target_truncated` no `HTTP1Request`, `lists_truncated` no `TLSInfo`,
    `transport_params_truncated` e `h3_settings_truncated` no `HTTP3Info`, e as descrições de `stream_id` 0 e
    `status` 0 no `HTTP2Stream`, de `probe_line` no `RawInfo` e de `rate_limited` no `DNSQuery`; 0.5.1, documental, com
    o openapi 0.6.1, ADRs 0038 e 0039: stream de 128 MiB e zona `finger-west-01.badblock.net.br` nos exemplos;
    0.6.0, aditivo, ADR 0047: canal `fs.v1.store.connection` publicado pelo store e serviço `bot` no envelope e
    no heartbeat; nenhum payload do openapi do store mudou; 0.6.1, documental, ADR 0056: métricas com rótulos no
    heartbeat; 0.6.2, documental, ADR 0057: o bucket `+Inf` dos histogramas não é enviado; 0.7.0, aditivo, com o
    openapi 0.7.0, ADRs 0070 e 0067: `method_truncated`/`version_truncated` e `controls.truncated` no `HTTP1Request`;
    `http_truncated`, `streams_truncated` e `requests_truncated` no `Connection` de `fs.v1.store.connection`).

    Exemplos (spec 017 RF-12): cada mensagem JSON referencia em `examples` (ou num trait `*Examples`) os eventos
    golden gerados pelo código real dos produtores (`internal/<svc>/testdata/`), regravados pelos próprios testes
    com `-update`. O AsyncAPI CLI só confere exemplos de documentos 2.x; a validação dos exemplos contra os payloads
    é um passo próprio do verify.
    Exemplo escrito à mão é marcado `(à mão)` no `summary` e trocado pelo golden quando o produtor o gerar.
  license:
    name: Apache-2.0
defaultContentType: application/json

servers:
  local:
    host: 127.0.0.1:4222
    protocol: nats
    description: Somente loopback.

channels:
  capturePacket:
    address: fs.v1.capture.packet
    messages:
      packetBatch: { $ref: "#/components/messages/PacketBatch" }
  webTLSClientHello:
    address: fs.v1.web.tls.client_hello
    messages:
      tlsClientHello: { $ref: "#/components/messages/TLSClientHello" }
  webTLSHandshake:
    address: fs.v1.web.tls.handshake
    messages:
      tlsHandshake: { $ref: "#/components/messages/TLSHandshake" }
  webHTTP1Request:
    address: fs.v1.web.http1.request
    messages:
      http1Request: { $ref: "#/components/messages/HTTP1Request" }
  webHTTP2Connection:
    address: fs.v1.web.http2.connection
    messages:
      http2Connection: { $ref: "#/components/messages/HTTP2Connection" }
  webHTTP2Stream:
    address: fs.v1.web.http2.stream
    messages:
      http2Stream: { $ref: "#/components/messages/HTTP2Stream" }
  webHTTP3Connection:
    address: fs.v1.web.http3.connection
    messages:
      http3Connection: { $ref: "#/components/messages/HTTP3Connection" }
  webHTTP3Request:
    address: fs.v1.web.http3.request
    messages:
      http3Request: { $ref: "#/components/messages/HTTP3Request" }
  webWebSocketFrame:
    address: fs.v1.web.websocket.frame
    messages:
      websocketFrame: { $ref: "#/components/messages/WebSocketFrame" }
  webStreamBytes:
    address: fs.v1.web.stream.bytes
    messages:
      streamBytes: { $ref: "#/components/messages/StreamBytes" }
  webRawSession:
    address: fs.v1.web.raw.session
    description: Conexão de porta web sem protocolo reconhecido (`raw/unknown`, modo sink — spec 005).
    messages:
      rawSession: { $ref: "#/components/messages/RawSession" }
  rawSession:
    address: fs.v1.raw.session
    messages:
      rawSession: { $ref: "#/components/messages/RawSession" }
  rawRead:
    address: fs.v1.raw.read
    messages:
      streamBytes: { $ref: "#/components/messages/StreamBytes" }
  dnsQuery:
    address: fs.v1.dns.query
    messages:
      dnsQuery: { $ref: "#/components/messages/DNSQuery" }
  dnsACMESet:
    address: fs.v1.dns.acme.set
    messages:
      acmeRequest: { $ref: "#/components/messages/ACMERequest" }
  dnsACMEClear:
    address: fs.v1.dns.acme.clear
    messages:
      acmeRequest: { $ref: "#/components/messages/ACMERequest" }
  dnsACMEReply:
    address: null
    description: Inbox de resposta do request/reply (NATS core).
    messages:
      acmeReply: { $ref: "#/components/messages/ACMEReply" }
  storeConnID:
    address: fs.v1.store.conn_id
    description: Request/reply NATS core (ADR 0017), fora do stream.
    messages:
      connIDRequest: { $ref: "#/components/messages/ConnIDRequest" }
  storeConnIDReply:
    address: null
    description: Inbox de resposta do `fs.v1.store.conn_id`.
    messages:
      connIDReply: { $ref: "#/components/messages/ConnIDReply" }
  storeConnection:
    address: fs.v1.store.connection
    description: NATS core (ADR 0047), fora do stream; estado da conexão depois do commit do store.
    messages:
      storeConnection: { $ref: "#/components/messages/StoreConnection" }
  svcHeartbeat:
    address: fs.v1.svc.heartbeat
    messages:
      heartbeat: { $ref: "#/components/messages/Heartbeat" }

operations:
  publishPackets:
    action: send
    channel: { $ref: "#/channels/capturePacket" }
    summary: capture publica lotes de pacotes.
  consumePackets:
    action: receive
    channel: { $ref: "#/channels/capturePacket" }
    summary: store consome (consumidor durável `store`).
  publishTLSClientHello:
    action: send
    channel: { $ref: "#/channels/webTLSClientHello" }
    summary: web e raw publicam o ClientHello analisado.
  publishTLSHandshake:
    action: send
    channel: { $ref: "#/channels/webTLSHandshake" }
  publishHTTP1Request:
    action: send
    channel: { $ref: "#/channels/webHTTP1Request" }
  publishHTTP2Connection:
    action: send
    channel: { $ref: "#/channels/webHTTP2Connection" }
  publishHTTP2Stream:
    action: send
    channel: { $ref: "#/channels/webHTTP2Stream" }
  publishHTTP3Connection:
    action: send
    channel: { $ref: "#/channels/webHTTP3Connection" }
  publishHTTP3Request:
    action: send
    channel: { $ref: "#/channels/webHTTP3Request" }
  publishWebSocketFrame:
    action: send
    channel: { $ref: "#/channels/webWebSocketFrame" }
  publishStreamBytes:
    action: send
    channel: { $ref: "#/channels/webStreamBytes" }
  publishRawSession:
    action: send
    channel: { $ref: "#/channels/rawSession" }
  publishWebRawSession:
    action: send
    channel: { $ref: "#/channels/webRawSession" }
    summary: web publica no fim de uma conexão tratada como TCP cru.
  publishRawRead:
    action: send
    channel: { $ref: "#/channels/rawRead" }
  publishDNSQuery:
    action: send
    channel: { $ref: "#/channels/dnsQuery" }
  requestACMESet:
    action: send
    channel: { $ref: "#/channels/dnsACMESet" }
    summary: web pede ao dns para publicar o TXT do DNS-01.
    reply:
      channel: { $ref: "#/channels/dnsACMEReply" }
  requestACMEClear:
    action: send
    channel: { $ref: "#/channels/dnsACMEClear" }
    reply:
      channel: { $ref: "#/channels/dnsACMEReply" }
  requestConnID:
    action: send
    channel: { $ref: "#/channels/storeConnID" }
    summary: web pede ao store o conn_id da 5-tupla (o store responde ou reserva um ULID por 30 s).
    reply:
      channel: { $ref: "#/channels/storeConnIDReply" }
  publishStoreConnection:
    action: send
    channel: { $ref: "#/channels/storeConnection" }
    summary: store, depois do commit de cada estágio da conexão (opened, updated, closed).
  consumeStoreConnection:
    action: receive
    channel: { $ref: "#/channels/storeConnection" }
    summary: bot (spec 018 RF-02).
  publishHeartbeat:
    action: send
    channel: { $ref: "#/channels/svcHeartbeat" }
    summary: Todos os serviços, a cada 5 s.

components:
  schemas:
    Flow:
      type: object
      description: 5-tupla do ponto de vista do cliente (src = cliente, dst = espelho).
      required: [l4, src_ip, src_port, dst_ip, dst_port]
      properties:
        l4: { type: string, enum: [tcp, udp] }
        src_ip: { type: string }
        src_port: { type: integer }
        dst_ip: { type: string }
        dst_port: { type: integer }
        quic_dcid_hex: { type: string, description: DCID do Initial (QUIC). }
    Envelope:
      type: object
      required: [schema_version, service, service_version, ts]
      properties:
        schema_version: { type: integer, const: 1 }
        service: { type: string, enum: [capture, web, raw, dns, store, bot] }
        service_version: { type: string }
        ts: { type: string, description: "RFC 3339 UTC com nanossegundos: quando o fato ocorreu. Nos resumos publicados no fim da sessão (`fs.v1.raw.session`, `fs.v1.web.raw.session`) é o accept, usado pelo store para achar a conexão; o instante da publicação é o metadado `Timestamp` do JetStream (ADR 0025)." }
        flow: { $ref: "#/components/schemas/Flow" }
        probe_id: { type: [string, "null"], description: Probe já extraído pelo produtor, quando houver. }
    StreamBytesPayload:
      type: object
      description: Pedaço de até 64 KiB de um sentido (ADR 0018).
      required: [dir, offset, data_b64]
      properties:
        dir: { type: string, enum: [in, out] }
        offset: { type: integer, description: Posição no fluxo de aplicação do sentido. }
        data_b64: { type: string, contentEncoding: base64 }
        truncated:
          type: boolean
          description: |
            true no último pedaço (vazio) quando o sentido passou de FS_RAW_STREAM_MAX_BYTES; nada mais é
            publicado nesse sentido.
    StoreConnectionPayload:
      type: object
      description: |
        Estado da conexão depois do commit do store (spec 004 RF-12, ADR 0047). `opened` = conexão criada com o SYN
        (ou primeiro datagrama/evento) analisado; `updated` = evento de aplicação incorporado, no máximo um a cada
        100 ms por conexão (os da janela saem como um só no fim dela, ADR 0055); `closed` = registro final. `connection` é o mesmo `Connection` de `GET /api/v1/connections/{conn_id}`, sem BLOBs; listas e
        strings cortadas para caber em 900 KiB levam as marcas `*_truncated` de sempre e `connection_truncated`.
      required: [stage, connection]
      properties:
        stage: { type: string, enum: [opened, updated, closed] }
        connection_truncated: { type: boolean, description: "true se o registro foi reduzido para caber em 900 KiB." }
        connection: { $ref: "../../cmd/finger-sniffer-store/openapi.yaml#/components/schemas/Connection" }
    ConnIDRequestPayload:
      type: object
      required: [flow, ts]
      properties:
        flow: { $ref: "#/components/schemas/Flow" }
        ts: { type: string, description: "Instante do accept (RFC 3339 UTC com nanossegundos)." }
    ConnIDReplyPayload:
      type: object
      required: [conn_id]
      properties:
        conn_id: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
        reserved: { type: boolean, description: "true se o ID foi reservado (a conexão ainda não existia no store)." }
    WebSocketFramePayload:
      type: object
      description: |
        Um frame visto pelo web, ou (com `upgrade_only`) só o Upgrade de uma sessão que terminou sem nenhum frame.
      properties:
        dir: { type: string, enum: [in, out] }
        opcode: { type: integer }
        fin: { type: boolean }
        rsv: { type: integer }
        masked: { type: boolean }
        mask_key_hex: { type: [string, "null"] }
        length: { type: integer }
        upgrade:
          type: [object, "null"]
          description: Presente no primeiro frame; dados do Upgrade e extensões negociadas.
          properties:
            over: { type: string, enum: [http1.1, h2] }
            path: { type: string }
            extensions: { type: [string, "null"] }
            subprotocol: { type: [string, "null"] }
        upgrade_only:
          type: boolean
          description: |
            `true` quando a sessão terminou sem nenhum frame que levasse o `upgrade` (o cliente fechou logo depois
            do 101): o evento traz só `upgrade` e campos de frame zerados (`dir: in`, `opcode: 0`, `length: 0`,
            `close: null`); o store preenche o `websocket` e não acrescenta frame (ADR 0032). Implantar o store
            antes do web ou junto. Ausente = `false`.
        close:
          type: [object, "null"]
          description: |
            Só no primeiro frame close da conexão (de quem iniciou o fechamento, spec 012 RF-06); o close de
            resposta sai como frame comum, sem este campo.
          properties:
            by: { type: string, enum: [client, server] }
            code: { type: [integer, "null"] }
            reason: { type: [string, "null"] }
    TLSHandshakePayload:
      type: object
      description: Resultado do handshake; o store funde no `tls` do registro (spec 004).
      properties:
        negotiated:
          type: [object, "null"]
          properties:
            version: { type: string }
            cipher: { type: string }
            group: { type: string }
            alpn: { type: [string, "null"] }
            resumed: { type: boolean }
        handshake_ms: { type: [number, "null"] }
        alerts:
          type: array
          description: |
            Alertas do handshake dos dois sentidos (spec 008 RF-04, ADR 0029): primeiro os registros `0x15` em texto
            claro vistos nos bytes, com nível e descrição exatos, na ordem; depois o alerta que o `crypto/tls`
            informar (cifrado), só se não houver um igual (mesma direção e descrição) vindo dos bytes.
          items:
            type: object
            properties:
              dir: { type: string, enum: [in, out] }
              level: { type: integer }
              description: { type: integer }
    HeartbeatPayload:
      type: object
      required: [status, commit, started_at]
      properties:
        status: { type: string, enum: [ok, degraded] }
        reasons: { type: array, items: { type: string } }
        commit: { type: string }
        started_at: { type: string }
        metrics:
          type: object
          description: |
            Contadores e medidas para o /metrics agregado (ex. dropped_events_total). A chave pode trazer rótulos no
            formato Prometheus, `nome{rotulo="valor",...}` (rótulos `[a-z_]+`, valores `[A-Za-z0-9_.:/-]{1,64}`);
            histograma vai como as séries cumulativas `nome_bucket{le="..."}` (só limites finitos: o bucket `+Inf` não
            é enviado, o store o tira de `nome_count`; ADR 0057 item 3), `nome_sum` e `nome_count`. O store
            republica `fs_<nome>{service,<rótulos>}`; chave malformada é ignorada e contada; até 512 chaves por
            heartbeat (ADR 0056 item 4).
          additionalProperties: { type: number }

  messageTraits:
    JSONEvent:
      contentType: application/json
    # Exemplos das mensagens ACME ficam em traits: os testes de contrato de pkg/event e internal/dns leem o bloco
    # dessas mensagens como texto e tomariam as chaves dos exemplos por propriedades.
    ACMERequestExamples:
      examples:
        - name: set_dns01
          summary: Pedido do provedor libdns do web (sem envelope).
          payload:
            $ref: "../../internal/web/testdata/events/dns.acme.set.json"
    ACMEReplyExamples:
      examples:
        - name: ok
          payload:
            $ref: "../../internal/dns/testdata/events/dns.acme.reply.ok.json"
        - name: out_of_zone
          summary: nome fora da zona.
          payload:
            $ref: "../../internal/dns/testdata/events/dns.acme.reply.error.json"

  messages:
    PacketBatch:
      name: PacketBatch
      title: Lote de pacotes (FSPB v1)
      contentType: application/octet-stream
      summary: Até 5 ms ou 256 pacotes por mensagem (spec 003 RF-04).
      description: |
        Corpo binário FSPB v1 (ADR 0015), little-endian, sequência de registros:

        | Campo | Tipo | Descrição |
        | --- | --- | --- |
        | ts_ns | u64 | timestamp do kernel, ns desde a época Unix (UTC) |
        | dir | u8 | 0 = in (para o espelho), 1 = out (do espelho) |
        | flags | u8 | bit0 = offload_suspect (frame > MTU + 14), bit1 = truncado pelo snaplen |
        | reserved | u16 | zero |
        | wire_len | u32 | tamanho no fio |
        | cap_len | u32 | bytes capturados que seguem |
        | frame | cap_len bytes | frame Ethernet completo (L2) |

        Cabeçalho do registro: 20 bytes. A mensagem não tem cabeçalho de arquivo; o número de registros
        vai no cabeçalho NATS `Fs-Count`. O store confere `Fs-Format` e `Fs-Schema-Version` antes de decodificar
        (divergência → lote descartado e contado) e compara `Fs-Count` com os registros lidos (ADR 0034).
      headers:
        type: object
        required: [Fs-Schema-Version, Fs-Service, Fs-Service-Version, Fs-Format, Fs-Count]
        properties:
          Fs-Schema-Version: { type: string, const: "1" }
          Fs-Service: { type: string, const: capture }
          Fs-Service-Version: { type: string }
          Fs-Format: { type: string, const: fspb1 }
          Fs-Count: { type: string, description: Número de registros (decimal). }
          Fs-Iface: { type: string }
      payload:
        type: string
        format: binary

    TLSClientHello:
      name: TLSClientHello
      examples:
        - name: web
          payload:
            $ref: "../../internal/web/testdata/events/tls.client_hello.json"
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      summary: ClientHello cru e analisado (spec 008), de web ou raw.
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: object
            properties:
              payload: { $ref: "../../cmd/finger-sniffer-store/openapi.yaml#/components/schemas/TLSInfo" }
    TLSHandshake:
      name: TLSHandshake
      examples:
        - name: web
          payload:
            $ref: "../../internal/web/testdata/events/tls.handshake.json"
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: object
            properties:
              payload: { $ref: "#/components/schemas/TLSHandshakePayload" }
    HTTP1Request:
      name: HTTP1Request
      examples:
        - name: web_chunked_100_continue
          payload:
            $ref: "../../internal/web/testdata/events/http1.request.json"
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      summary: Uma requisição HTTP/1.x e a resposta enviada (spec 009).
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: object
            properties:
              payload: { $ref: "../../cmd/finger-sniffer-store/openapi.yaml#/components/schemas/HTTP1Request" }
    HTTP2Connection:
      name: HTTP2Connection
      examples:
        - name: web
          payload:
            $ref: "../../internal/web/testdata/events/http2.connection.json"
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      summary: Nível de conexão h2 (prefácio, SETTINGS, PRIORITY, Akamai, frames); `streams` vazio.
      description: |
        Pode ser publicado mais de uma vez na mesma conexão (ex. depois do prefácio e no fim, com os frames);
        o store fica com a última versão.
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: object
            properties:
              payload: { $ref: "../../cmd/finger-sniffer-store/openapi.yaml#/components/schemas/HTTP2Info" }
    HTTP2Stream:
      name: HTTP2Stream
      examples:
        - name: web
          payload:
            $ref: "../../internal/web/testdata/events/http2.stream.json"
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: object
            properties:
              payload: { $ref: "../../cmd/finger-sniffer-store/openapi.yaml#/components/schemas/HTTP2Stream" }
    HTTP3Connection:
      name: HTTP3Connection
      examples:
        - name: web
          payload:
            $ref: "../../internal/web/testdata/events/http3.connection.json"
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      summary: Initial QUIC analisado, SETTINGS do h3 e fim da conexão (spec 011, ADR 0019).
      description: |
        Nível de conexão; `requests` vai vazio (as requisições vão por `fs.v1.web.http3.request`). Publicado até
        três vezes por conexão QUIC, cada versão substituindo a anterior no store: (1) quando o handshake termina
        ou falha, com o Initial analisado; (2) quando chega o SETTINGS do cliente; (3) no fim, com `close`
        preenchido. `flow.l4` = `udp` e `flow.quic_dcid_hex` = DCID do primeiro Initial do cliente.
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: object
            properties:
              payload: { $ref: "../../cmd/finger-sniffer-store/openapi.yaml#/components/schemas/HTTP3Info" }
    HTTP3Request:
      name: HTTP3Request
      examples:
        - name: web
          payload:
            $ref: "../../internal/web/testdata/events/http3.request.json"
      traits: [{ $ref: "#/components/messageTraits/JSONEvent" }]
      summary: Uma requisição h3, publicada quando a resposta termina (spec 011 RF-03, ADR 0019).
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
