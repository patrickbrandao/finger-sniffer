# Pilha TCP do espelho, fixa e documentada (spec 016 RF-02, ADR 0011).
# Este arquivo é a documentação oficial de como o espelho responde em TCP.
# O /api/v1/health publica os valores efetivos e a versão do kernel.

# SYN cookies só quando a fila estoura; filas grandes para que nunca disparem em uso normal.
net.ipv4.tcp_syncookies = 1
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096

# Opções TCP anunciadas pelo espelho
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_window_scaling = 1
# ECN: aceita quando o cliente pede, não inicia (padrão do Linux)
net.ipv4.tcp_ecn = 2
# TFO: cliente e servidor, para observar o TFO dos clientes
net.ipv4.tcp_fastopen = 3

# Controle de congestionamento e fila
net.ipv4.tcp_congestion_control = htcp
net.core.default_qdisc = fq_codel

# Portas efêmeras (fluxos iniciados pelo servidor)
net.ipv4.ip_local_port_range = 32768 60999
