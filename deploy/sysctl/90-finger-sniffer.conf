# Pilha TCP do espelho, fixa e documentada (spec 016 RF-02, ADRs 0011 e 0038).
# Este arquivo é a documentação oficial de como o espelho responde em TCP.
# O /api/v1/health publica os valores efetivos e a versão do kernel.
# No finger-01 ele carrega depois dos arquivos do host (51-…67-) e nunca reduz um valor deles: as chaves que o
# host também define ficam com o mesmo valor. Sysctls do host que o espelho não fixa (ip_default_ttl=128,
# tcp_mtu_probing=1, rmem_default/wmem_default, tcp_no_metrics_save=1) não entram aqui (ADR 0038 item 7).

# SYN cookies só quando a fila estoura; filas grandes para que nunca disparem em uso normal.
net.ipv4.tcp_syncookies = 1
# 65535: o valor do host (ADR 0038 item 7)
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# Opções TCP anunciadas pelo espelho
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_window_scaling = 1
# ECN: aceita quando o cliente pede, não inicia (padrão do Linux)
net.ipv4.tcp_ecn = 2
# TFO: cliente e servidor, para observar o TFO dos clientes
net.ipv4.tcp_fastopen = 3

# Controle de congestionamento e fila
net.ipv4.tcp_congestion_control = htcp
net.core.default_qdisc = fq_codel

# Portas efêmeras (fluxos iniciados pelo servidor); acima do 1024 65535 do host para manter 8080/8443/9000/9001
# fora da faixa efêmera (ADR 0038 item 7)
net.ipv4.ip_local_port_range = 32768 60999

# Teto dos buffers de socket: o do host (128 MiB), acima dos ~7 MiB que o quic-go pede (ADR 0019). É teto, não
# reserva; o web limita os próprios sockets (ADR 0037) e o valor do host não é reduzido (ADR 0038 item 7).
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
