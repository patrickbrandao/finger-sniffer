# Journal próprio do espelho (spec 016 RF-08, ADR 0075 item 3), instalado em /etc/systemd/journald@finger-sniffer.conf:
# vale só para as units com LogNamespace=finger-sniffer; o journal do host fica com a configuração dele. Retenção das
# ADRs 0012 e 0052: 24 h / 200 MB, em disco e em /run.
[Journal]
MaxRetentionSec=24h
SystemMaxUse=200M
RuntimeMaxUse=200M
