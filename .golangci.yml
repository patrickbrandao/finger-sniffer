# golangci-lint v2 (ADR 0013)
version: "2"

run:
  timeout: 5m
  # Arquivos com tag entram no lint (spec 017 RF-08a, task 359); linux_priv fica no vet com GOOS=linux.
  build-tags: [e2e, load, golden]

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - revive
    - ineffassign
    - unused
    # Diretivas //nolint sem efeito, sem linter específico ou sem explicação viram achado (task 399).
    - nolintlint
  settings:
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: package-comments
        - name: error-strings
        - name: receiver-naming
  exclusions:
    rules:
      # Testes podem usar construções que o gosec reprova (arquivos temporários, números fixos).
      - path: _test\.go
        linters: [gosec]
      # Clientes e servidores de captura dos goldens (tag golden): URL e resposta vêm de quem roda a captura.
      - path: ^test/golden/
        linters: [gosec]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/patrickbrandao/finger-sniffer
