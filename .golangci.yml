# golangci-lint v2 (ADR 0013)
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - revive
    - ineffassign
    - unused
  settings:
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: package-comments
        - name: error-strings
        - name: receiver-naming
  exclusions:
    rules:
      # Testes podem usar construções que o gosec reprova (arquivos temporários, números fixos).
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/patrickbrandao/finger-sniffer
